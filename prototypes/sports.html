<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports | KSCU 103.3 FM</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  /* Colors and borders copied from kscu.org so the page feels native */
  :root {
    --bg: #ede8e0;
    --paper: #f5f1ea;
    --ink: #111827;
    --ink-soft: #1f2937;
    --muted: #4b5563;
    --brown: #64514d;
    --red: #bf514d;
    --red-tint: rgba(191, 81, 77, 0.06);
    --win: #2f6b3a;
    --bronco: #a6192e;      /* Santa Clara red */
    --bronco-deep: #690b0b; /* ESPN's official SCU team color */
    --mono: "IBM Plex Mono", monospace;
    --sans: "IBM Plex Mono", ui-monospace, monospace; /* whole page uses the announcement-box font */
    --cond: var(--sans);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  .wrap { width: 90%; max-width: 80rem; margin: 0 auto; }
  .mono { font-family: var(--mono); }

  /* ================= header (stand-in for the theme's real header) ================= */
  .topbar { display: flex; border: 1px solid #000; margin: 16px auto 0; background: var(--bg); position: relative; z-index: 20; }
  .topbar .logo { display: flex; align-items: center; padding: 6px 10px; border-right: 1px solid #000; }
  .topbar .logo img { height: 34px; }
  .topbar .rows { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar .row { display: flex; align-items: center; gap: 12px; padding: 4px 10px; font-size: 14px; min-height: 26px; }
  .topbar .row + .row { border-top: 1px solid #000; }
  .topbar nav { margin-left: auto; display: flex; gap: 16px; font-size: 15px; font-weight: 500; align-items: center; }
  .topbar nav > a, .navdrop > button { text-decoration: none; background: none; border: 0; padding: 0; cursor: pointer; font-weight: 500; }
  .topbar nav > a:hover, .navdrop > button:hover, .navdrop > button.active { text-decoration: underline; text-underline-offset: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); display: inline-block; flex: none; }
  .dot.pulse { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(191,81,77,.6)} 70%{box-shadow:0 0 0 8px rgba(191,81,77,0)} 100%{box-shadow:0 0 0 0 rgba(191,81,77,0)} }

  /* "Sports ▾" dropdown: Men's | Women's columns */
  .navdrop { position: relative; }
  /* Always laid out, but invisible until .open. Opening: quick fade/slide down. Closing (after a short JS delay):
     slower fade/slide up, and visibility flips only once the fade has finished, so it never blinks out. */
  .navdrop .panel { display: grid; position: absolute; right: -10px; top: calc(100% + 9px); background: var(--bg); border: 1px solid #000;
    padding: 10px; grid-template-columns: 1fr 1fr; gap: 4px 18px; width: 380px; box-shadow: 4px 4px 0 rgba(0,0,0,.85);
    opacity: 0; visibility: hidden; transform: translateY(-6px); pointer-events: none;
    transition: opacity .28s ease, transform .28s ease, box-shadow .28s ease, visibility 0s linear .28s; }
  .navdrop:not(.open) .panel { box-shadow: 0 0 0 rgba(0,0,0,0); }
  .navdrop.open .panel { opacity: 1; visibility: visible; transform: none; pointer-events: auto;
    transition: opacity .16s var(--ease), transform .16s var(--ease), box-shadow .16s var(--ease), visibility 0s; }
  /* you-are-here: current page is marked in the menu */
  /* every item has the same box; the you-are-here bar is drawn inside it, so nothing shifts */
  .panel a { position: relative; }
  .panel a::before { content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 3px; background: transparent; }
  .panel a[aria-current="page"] { background: color-mix(in srgb, var(--red) 12%, var(--bg)); }
  .panel a[aria-current="page"]::before { background: var(--red); }
  .panel a[aria-current="page"]::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--red); margin-left: auto; flex: none; }
  .panel a[aria-current="page"]:hover { background: var(--ink); color: var(--bg); }
  .panel-foot { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; border-top: 1px solid #000; margin-top: 6px; padding-top: 6px; }
  .navdrop .panel::before { content: ""; position: absolute; top: -14px; left: 0; right: 0; height: 14px; } /* hover bridge over the gap */
  .navdrop::after { content: ""; position: absolute; left: -12px; right: -12px; top: 100%; height: 12px; } /* bridge from the button side */
  .panel h4 { margin: 0 0 4px; font-size: 12px; font-weight: 700; letter-spacing: .06em; border-bottom: 1px solid #000; padding: 0 8px 4px 10px; }
  .panel a { display: flex; align-items: center; gap: 8px; text-decoration: none; padding: 4px 8px 4px 10px; font-size: 14px; min-height: 30px; box-sizing: border-box; }
  .panel a:hover { background: var(--ink); color: var(--bg); }
  .panel a:hover .ico { --ink: var(--bg); --paper: #111827; }
  .panel .ico { width: 22px; height: 22px; }
  .panel .all { font-family: var(--mono); font-weight: 700; font-size: 13px; }

  /* ================= page title + announcement box (same as homepage) ================= */
  h1.title { font-family: var(--mono); font-weight: 700; font-size: clamp(30px, 5vw, 42px); color: var(--ink-soft);
    margin: 28px 0 0; letter-spacing: .02em; }
  .announcement-box { border: 2px solid var(--brown); padding: 15px; margin: 18px 0 22px; background: var(--red-tint);
    font-family: var(--mono); font-weight: 700; font-size: .95rem; color: #1a1a1a; line-height: 1.5; }
  .announcement-box a { text-underline-offset: 3px; }

  /* ================= sport sub-menu (icon tab strip) ================= */
  /* wraps into a grid on narrow screens so every sport stays visible */
  .rail { margin-top: 20px; display: grid; grid-template-columns: repeat(var(--cols, 9), 1fr); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); background: var(--bg); }
  .rail a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px; text-align: center;
    text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: .02em; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); position: relative; }
  .rail a:hover { background: rgba(0,0,0,.05); }
  .rail a[aria-current="page"] { background: var(--ink); color: var(--bg); }
  .rail a[aria-current="page"] .ico { --ink: var(--bg); --paper: #111827; --accent: #e98b86; }
  .rail .ico { width: 40px; height: 40px; }
  .rail .livepip { position: absolute; top: 6px; right: 8px; }

  /* ================= generic bordered "tab" card, like LIVE NOW / NEXT UP ================= */
  .card { position: relative; padding-top: 30px; min-width: 0; }
  .tab { position: absolute; top: 0; left: 0; border: 1px solid var(--ink); border-bottom: 0; padding: 4px 8px; font-size: 14px;
    font-weight: 700; background: var(--bg); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .tab.right { left: auto; right: 0; }
  .box { border: 1px solid var(--ink); }
  .pad { padding: 12px 14px; }
  .big { font-size: 23px; font-weight: 700; margin: 0; line-height: 1.2; }
  .sub { font-size: 17px; font-weight: 700; margin: 3px 0 0; display: flex; align-items: center; gap: 8px; }
  .when { border-top: 1px solid var(--ink); padding: 8px 14px; font-weight: 600; text-transform: uppercase; font-size: 15px; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 2px; font-family: var(--cond); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin: 28px 0; }
  .empty { padding: 16px 12px; font-family: var(--mono); font-size: 14px; }

  .mixlr-box { display: flex; flex-direction: column; }
  .mixlr-frame { display: block; width: 100%; height: 180px; min-height: 180px; flex: 1; border: 0; }
  .mixlr-fallback { font-family: var(--mono); font-size: 13px; padding: 8px 14px; border-top: 1px solid var(--ink); }
  .next-box { display: flex; flex-direction: column; justify-content: space-between; height: calc(100% - 0px); min-height: 150px; }
  .grid2 > .card { display: flex; flex-direction: column; }
  .grid2 > .card > .box { flex: 1; }
  .next-wrap { display: flex; gap: 14px; align-items: center; }
  .next-wrap .ico { width: 64px; height: 64px; flex: none; }

  /* live score strip */
  .live-strip { display: none; border: 2px solid var(--red); background: var(--red-tint); padding: 10px 14px; margin: 18px 0 0;
    font-family: var(--mono); font-weight: 700; align-items: center; gap: 12px; flex-wrap: wrap; }
  .score-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px 12px; margin-top: 10px; font: 12px var(--mono); }
  .score-tools button { border: 1px solid var(--ink); background: var(--paper); color: var(--ink); padding: 6px 10px; cursor: pointer; }
  .score-tools button:disabled { opacity: .65; cursor: default; }
  .score-tools[hidden] { display: none; }
  .live-strip.on { display: flex; }

  /* ================= THIS WEEK strip ================= */
  .week { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); overflow-x: auto; border: 1px solid var(--ink); }
  .wk { border-right: 1px dashed rgba(17,24,39,.4); padding: 10px 12px 12px; text-decoration: none; display: flex; flex-direction: column; gap: 6px; min-height: 150px; }
  .wk:last-child { border-right: 0; }
  .wk:hover { background-color: rgba(0,0,0,.04); }
  /* light gender dots behind each game: pink = women's team, blue = men's (fainter than the sport page header) */
  .wk.g-womens, .wk.g-mens { --dot: #f6cbdf;
    background-image: radial-gradient(circle, var(--dot) 1.3px, transparent 1.8px), radial-gradient(circle, var(--dot) 1.3px, transparent 1.8px);
    background-size: 14px 14px; background-position: 0 0, 7px 7px; background-origin: content-box; background-clip: content-box; }
  .wk.g-mens { --dot: #c9daf2; }
  .wk:hover .ico * { animation-play-state: running; }
  .wk .day { font-family: var(--mono); font-size: 12px; font-weight: 700; display: flex; justify-content: space-between; border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
  .wk .ico { width: 44px; height: 44px; }
  .wk .opp { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .wk.today .day { color: var(--red); }

  /* ================= sport tiles (overview) ================= */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 22px; margin-bottom: 48px; }
  .tile { border: 1px solid var(--ink); text-decoration: none; display: flex; flex-direction: column; background: var(--bg);
    transition: transform .15s ease, box-shadow .15s ease; }
  .tile { box-shadow: 3px 3px 0 rgba(17,24,39,.22); }
  .tile:hover { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--ink); }
  .tile:hover .ico * { animation-play-state: running; }
  .tile-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--ink); }
  .tile-head .ico { width: 54px; height: 54px; flex: none; }
  .teams .tiles { border-top: 1px solid var(--ink); padding-top: 18px; }
  .tile-head::after { content: "→"; margin-left: auto; font-family: var(--mono); font-weight: 700; font-size: 18px; transition: transform .25s var(--ease); }
  .tile:hover .tile-head::after { transform: translateX(4px); }
  .tile-head h3 { margin: 0; font-family: var(--mono); font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
  .tile-row { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 9px 14px; align-items: start; }
  .tile-row + .tile-row { border-top: 1px dashed rgba(17,24,39,.35); }
  /* restroom-sign team markers: blue = men's, pink = women's */
  /* Figures: public-domain AIGA/US DOT restroom pictograms (Wikimedia Commons),
     used as a mask so CSS can paint them, on a little enamel-sign plaque. */
  .sign { --c: #3d74c4; position: relative; display: inline-block; width: 24px; height: 24px; flex: none; vertical-align: middle;
    background: var(--c); border: 1.5px solid var(--ink); border-radius: 4px; box-shadow: 1.5px 1.5px 0 var(--ink); }
  .sign.womens { --c: #e0679b; }
  .sign::before { content: ""; position: absolute; inset: 9%; background: #fff;
    -webkit-mask: var(--fig) center / contain no-repeat; mask: var(--fig) center / contain no-repeat; }
  .sign.mens { --fig: url("img/restroom-men.png"); }
  .sign.womens { --fig: url("img/restroom-women.png"); }
  .sign::after { content: ""; position: absolute; inset: 2px; border: 1px solid rgba(255,255,255,.45); border-radius: 2px; } /* enamel rim */
  .sign.lg { width: 38px; height: 38px; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
  .seg .sign { width: 20px; height: 20px; box-shadow: none; }
  .tile-row .line { font-size: 14px; font-weight: 600; }
  /* team tile: stretched title link + one boxed "last game" chip per team */
  .tile { position: relative; }
  .tile-link { color: inherit; text-decoration: none; }
  .tile-link::after { content: ""; position: absolute; inset: 0; }
  .tile-link:focus-visible { outline: none; }
  .tile:has(.tile-link:focus-visible) { outline: 2px solid var(--red); outline-offset: 3px; }
  .tr-body { min-width: 0; display: flex; flex-direction: column; gap: 6px; container-type: inline-size; }
  .lc-opp { display: flex; align-items: center; gap: 6px; }
  .lc-opp img { width: 18px; height: 18px; object-fit: contain; flex: none; margin: 0; }
  .lc-opp .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  @container (max-width: 250px) { .lc-opp.has-logo .nm { display: none; } } /* narrow box: logo only */
  .lchip { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; min-width: 0; padding: 5px 8px; font-size: 13px;
    background: var(--paper); border: 1px solid var(--ink); color: inherit; text-decoration: none; transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
  a.lchip:hover { transform: translate(-1px, -1px); box-shadow: 2px 2px 0 var(--ink); }
  .lchip .lsq { font-style: normal; font-family: var(--mono); font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; padding: 0 3px; flex: 0 0 auto; box-sizing: border-box;
    display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--ink); }
  .lchip .lsq.W { background: var(--win); border-color: var(--win); color: #fff; }
  .lchip .lsq.L { background: var(--red); border-color: var(--red); color: #fff; }
  .lchip .lsq.D { background: var(--brown); border-color: var(--brown); color: #fff; }
  .lchip b { font-family: var(--mono); font-size: 13px; flex: none; }
  .lc-opp { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lc-date { font-family: var(--cond); font-size: 12px; color: var(--muted); flex: none; }
  .tile-row .line.next { font-size: 13px; }
  .tile-row .line.next b { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); margin-right: 6px; }
  @media (max-width: 520px) { .lchip { padding: 8px; min-height: 40px; } }
  .tile-row .line span { font-weight: 400; color: var(--muted); font-family: var(--cond); }

  /* recent-form blocks: W / L / placings */
  .form { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 5px; }
  .form i, .form a { font-style: normal; text-decoration: none; font-family: var(--mono); font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; padding: 0 3px;
    display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--ink); }
  .form a { color: inherit; transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
  .form a:hover { transform: translateY(-2px); box-shadow: 0 2px 0 var(--ink); }
  .form i.W, .form a.W { background: var(--win); border-color: var(--win); color: #fff; }
  .form i.L, .form a.L { background: var(--red); border-color: var(--red); color: #fff; }
  .form i.D, .form a.D { background: var(--brown); border-color: var(--brown); color: #fff; }
  .form.lg i, .form.lg a { min-width: 24px; height: 24px; font-size: 12px; }

  /* ================= sport page hero ================= */
  .hero { display: grid; grid-template-columns: auto 1fr minmax(260px, 340px); border: 1px solid var(--ink); margin: 28px 0; background: var(--red-tint); }
  .hero-ico { padding: 14px 18px; border-right: 1px solid var(--ink); display: flex; align-items: center; background: var(--bg); }
  .hero-ico .ico { width: 130px; height: 130px; }
  /* team color behind the animated icon: pink polka dots for women's teams, blue for men's (the icon itself is transparent) */
  .hero.g-womens .hero-ico, .hero.g-mens .hero-ico { --dot: #efb1cd; background-color: var(--bg);
    background-image: radial-gradient(circle, var(--dot) 1.6px, transparent 2.1px), radial-gradient(circle, var(--dot) 1.6px, transparent 2.1px);
    background-size: 16px 16px; background-position: 0 0, 8px 8px; }
  .hero.g-mens .hero-ico { --dot: #afc8ec; }
  .hero-main { padding: 16px 20px; min-width: 0; }
  .hero-main h2 { font-family: var(--mono); font-weight: 700; font-size: clamp(24px, 3.4vw, 36px); letter-spacing: -.02em; margin: 0; line-height: 1.05; }
  .seg { display: inline-flex; border: 1px solid var(--ink); margin: 12px 0 14px; }
  .seg a { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; font-family: var(--mono); font-size: 13px; font-weight: 700; text-decoration: none; }
  .seg a + a { border-left: 1px solid var(--ink); }
  .seg a[aria-current="true"] { background: var(--ink); color: var(--bg); }
  .seg a:hover:not([aria-current="true"]) { background: rgba(0,0,0,.06); }
  /* hero stats: each number in its own box with a label strip. Season record leads in Bronco red, the WCC
     standing + conference record share a blue "conference" strip, the streak is green or red, schedule counts stay plain. */
  .stats { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
  .stat { --band: var(--ink); display: flex; flex-direction: column; min-width: 78px; border: 1px solid var(--ink); background: var(--paper);
    box-shadow: 2px 2px 0 var(--ink); text-align: center; }
  .stat b { display: block; font-family: var(--mono); font-size: 26px; line-height: 1; padding: 8px 10px 6px; flex: 1;
    display: flex; align-items: center; justify-content: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .stat span { display: block; font-size: 10px; font-weight: 700; letter-spacing: .07em; padding: 3px 8px; background: var(--band); color: #fff; white-space: nowrap; }
  .stat.season { --band: var(--bronco); } .stat.season b { color: var(--bronco); }
  .stat.rank, .stat.conf { --band: #2f5f9e; }
  .stat.streak.W { --band: var(--win); } .stat.streak.W b { color: var(--win); }
  .stat.streak.L { --band: var(--red); } .stat.streak.L b { color: var(--red); }
  .stat.sched { background: transparent; box-shadow: none; border-style: dashed; }
  .stat.sched span { background: transparent; color: var(--ink); border-top: 1px dashed var(--ink); }
  @media (max-width: 560px) {
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat { min-width: 0; }
    .stat b { font-size: 22px; padding: 7px 4px 5px; }
    .stat span { white-space: normal; font-size: 9px; padding: 3px 4px; }
  }
  .hero-next { border-left: 1px solid var(--ink); display: flex; flex-direction: column; background: var(--bg); }
  .hero-next .lbl { font-size: 13px; font-weight: 700; padding: 6px 14px; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; }
  .hero-next .pad { flex: 1; }
  .listen { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; border: 1px solid var(--ink); padding: 6px 12px;
    font-family: var(--mono); font-size: 13px; font-weight: 700; text-decoration: none; background: var(--bg); }
  .listen:hover { background: var(--ink); color: var(--bg); }

  /* ================= game lists ================= */
  .game { display: grid; grid-template-columns: 62px 1fr auto; gap: 12px; padding: 10px 12px; align-items: center; }
  .game + .game { border-top: 1px dashed rgba(17,24,39,.35); }
  .cal { border: 1px solid var(--ink); text-align: center; font-family: var(--mono); background: var(--bg); }
  .cal .m { background: var(--ink); color: var(--bg); font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 1px 0; }
  .cal .d { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .cal .w { font-size: 10px; padding-bottom: 2px; }
  .opp { font-weight: 700; font-size: 16px; }
  .res { font-family: var(--mono); font-weight: 700; font-size: 14px; text-align: right; white-space: nowrap; }
  .res.W { color: var(--win); } .res.L { color: var(--red); } .res.D { color: var(--brown); }
  .badge { font-family: var(--mono); font-size: 11px; border: 1px solid var(--ink); padding: 1px 5px; margin-left: 6px; vertical-align: 2px; font-weight: 700; }
  /* venue tags: HOME = solid, AWAY = outline, NEUTRAL = dashed outline */
  .vb { display: inline-block; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; line-height: 1.35;
    border: 1px solid var(--ink); padding: 0 5px; margin-left: 7px; vertical-align: 2px; white-space: nowrap; }
  .vb.home, .tile-row .line .vb.home { background: var(--bronco); color: #fff; border-color: var(--bronco-deep); font-weight: 700; }
  .vb.away { background: transparent; color: var(--ink); }
  .vb.neutral { border-style: dashed; color: var(--muted); }
  .vb.mini { font-size: 8.5px; padding: 0 2px; margin: 0; vertical-align: 0; letter-spacing: 0; flex: none; }
  .more { width: 100%; border: 0; border-top: 1px solid var(--ink); background: transparent; padding: 8px; font-family: var(--mono); font-weight: 700; cursor: pointer; }
  .more:hover { background: rgba(0,0,0,.05); }
  .section-gap { margin-bottom: 48px; }

  /* ---------- featured game center, laid out wide on the overview ---------- */
  .featured { margin: 30px 0; }

  .gc.wide > .gc-top { grid-column: 1 / -1; }

  .gc.wide .gc-side { display: flex; flex-direction: column; }

  .gc.wide .gc-side .gc-last { margin-top: auto; border-top: 1px solid var(--ink); }
  .gc-body { display: block; }
  .gc.wide .gc-body { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  .gc.wide .gc-body .gc-r { border-left: 1px solid var(--ink); padding-top: 12px; }

    .gc.wide .gc-body .gc-r { border-left: 0; border-top: 1px solid var(--ink); }
  }

  /* ================= game center (countdown / live box score) ================= */
  .tab-live { background: var(--bronco); color: #fff; border-color: var(--bronco-deep); }
  .tab-live .dot { background: #fff; }
  .card.live-card { padding-top: 0; }

  .live-card-head .tab-live { padding: 4px 8px; font-size: 14px; font-weight: 700; }
  .live-card-head > .mono { padding: 4px 8px; font-size: 12px; }
  .gc { display: flex; flex-direction: column; background: var(--bg); }
  .gc-top { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--ink); font-size: 13px; letter-spacing: .04em; }
  .gc-top .ico { width: 30px; height: 30px; flex: none; }

  .gc-top .vb { margin-left: 0; }
  .gc-top.live { background: var(--bronco); color: #fff; border-bottom-color: var(--bronco-deep); }
  .gc-top.live .ico { --ink: #fff; --paper: var(--bronco); --accent: #ffd0cc; }
  .live-pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-weight: 700; border: 1px solid #fff; padding: 1px 8px; font-size: 12px; }
  .live-pill .dot { background: #fff; }
  .gc-match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 14px 12px 6px; }
  .gc-team { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; min-width: 0; }
  .tlogo { width: 60px; height: 60px; object-fit: contain; display: block; flex: none; }
  .mono-logo { display: flex; align-items: center; justify-content: center; border: 2px solid var(--ink); border-radius: 50%;
    font-family: var(--mono); font-weight: 700; font-size: 16px; background: var(--paper); color: var(--ink); box-sizing: border-box; }
  .tlogo.sm { width: 24px; height: 24px; } .mono-logo.sm { font-size: 9px; border-width: 1px; }
  .tlogo.xs { width: 18px; height: 18px; display: inline-flex; vertical-align: -4px; margin-right: 6px; } .mono-logo.xs { font-size: 7px; border-width: 1px; }
  .gc-name { font-weight: 700; font-size: 15px; line-height: 1.15; }
  .gc-rec { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .gc-vs { font-family: var(--mono); font-weight: 700; font-size: 22px; color: var(--bronco); }
  .gc-event { display: flex; align-items: center; gap: 12px; padding: 14px 12px 6px; }
  .gc-when { text-align: center; font-weight: 600; text-transform: uppercase; font-size: 14px; padding: 4px 12px 10px; }
  .cd { display: flex; justify-content: center; gap: 8px; padding: 0 12px 14px; flex-wrap: wrap; }
  .cd-cell { border: 1px solid var(--ink); min-width: 60px; text-align: center; background: var(--paper); box-shadow: 2px 2px 0 var(--ink); }
  .cd-cell b { display: block; font-family: var(--mono); font-size: 28px; line-height: 1.15; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .cd-cell span { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 2px 0; background: var(--ink); color: var(--bg); }
  .cd-cell:first-child b { color: var(--bronco); }
  .cd-now { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-weight: 700; color: var(--bronco); }
  .gc-info { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; border-top: 1px solid var(--ink); font-size: 12px; font-family: var(--mono); margin-top: auto; }
  .gc-info a { font-weight: 700; text-underline-offset: 3px; }
  .tv { font-family: var(--mono); font-size: 11px; font-weight: 700; border: 1px solid var(--ink); padding: 0 5px; white-space: nowrap; }
  .rowlink { font-family: var(--mono); font-size: 10.5px; font-weight: 700; color: var(--bronco); text-underline-offset: 2px; }
  .gc-last { border-top: 1px dashed rgba(17,24,39,.45); padding: 8px 12px 10px; background: rgba(255,255,255,.3); }
  .gc-last-h { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  .gc-last-row { display: flex; align-items: center; gap: 10px; }
  .gc-last-row .ico { width: 28px; height: 28px; flex: none; }
  .lr-score { flex: 1; display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 13px; min-width: 0; }
  .lr-n { font-size: 18px; font-weight: 700; }
  .lr-t { font-family: var(--sans); font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* live box score */
  .gc-score { text-align: center; }
  .gc-score b { font-family: var(--mono); font-size: 42px; line-height: 1; font-variant-numeric: tabular-nums; }
  .gc-score span { margin: 0 6px; font-size: 28px; }

  .gc-clock.W { color: var(--win); } .gc-clock.L { color: var(--red); } .gc-clock.D { color: var(--brown); }
  .final-pill { font-family: var(--mono); font-size: 12px; font-weight: 700; border: 1px solid var(--ink); padding: 2px 8px; background: var(--paper); }
  .ls { width: calc(100% - 24px); margin: 6px 12px 12px; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  .ls th, .ls td { border: 1px solid var(--ink); padding: 3px 6px; text-align: center; }
  .ls th { background: var(--ink); color: var(--bg); font-size: 10px; letter-spacing: .05em; }
  .ls td:first-child { text-align: left; font-weight: 700; white-space: nowrap; }

  .wp { margin: 0 12px 12px; }

  .wp-bar i.us, .sb-bar i.us { background: var(--bronco); }

  .sbars { padding: 0 12px 12px; display: grid; gap: 7px; }
  .sb { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; font-weight: 700; }
  .sb > span:last-child { text-align: right; }
  .sb-l { grid-column: 1 / -1; text-align: center; font-size: 10px; letter-spacing: .06em; color: var(--muted); margin-bottom: -5px; }
  .sb-bar { height: 8px; }
  .ldr { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ink); }
  .ldr > div { padding: 8px 12px; min-width: 0; }
  .ldr > div + div { border-left: 1px dashed rgba(17,24,39,.45); }

  .ldr p span { color: var(--muted); font-family: var(--mono); font-size: 10px; font-weight: 700; }
  .ldr p b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ldr p em { font-style: normal; font-family: var(--mono); font-weight: 700; }
  .l5 { padding: 10px 12px 12px; }
  .gc-r > .l5:not(:first-child) { border-top: 1px solid var(--ink); }
  .l5 h5 { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em; color: var(--muted); }
  .l5-row { display: grid; grid-template-columns: 24px 44px 1fr; align-items: center; gap: 6px; margin: 6px 0; font-family: var(--mono); font-size: 13px; }
  .l5-row .form { margin: 0; }
  .gc-play { padding: 8px 12px; border-top: 1px solid var(--ink); font-size: 13px; }
  .gc-play b { font-family: var(--mono); font-size: 11px; color: var(--bronco); margin-right: 8px; }
  .gc-plays { border-top: 1px solid var(--ink); padding: 8px 12px 10px; font-size: 13px; }
  .pl-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; margin-bottom: 4px; }
  .pl-head b { font-family: var(--mono); font-size: 11px; color: var(--bronco); }
  .pl-head button { font: 700 11px var(--mono); border: 1px solid var(--ink); background: var(--paper); color: var(--ink); padding: 3px 8px; cursor: pointer; }
  .pl-head button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .gc-plays ol { list-style: none; margin: 0; padding: 0; }

  .gc-plays li:first-child { border-top: 0; }
  .pl-when { grid-column: 1 / -1; font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .pl-text { display: flex; align-items: flex-start; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
  .pl-text .tlogo { flex: none; margin-top: 1px; }
  .pl-score { font-family: var(--mono); font-size: 12px; font-weight: 700; white-space: nowrap; align-self: start; }
  .gc-plays li.sc .pl-text { font-weight: 700; }
  .pl-none { color: var(--muted); }
  .hero-next.gc .gc-match { padding-top: 10px; }
  .hero-next.gc .tlogo:not(.sm):not(.xs) { width: 46px; height: 46px; }
  .hero-next.gc .cd-cell { min-width: 50px; }
  .hero-next.gc .cd-cell b { font-size: 22px; }
  .hero-next.gc .gc-top .ico { display: none; }
  .news a { display: block; padding: 10px 12px; text-decoration: none; transition: background-color .2s var(--ease); }
  .news a + a { border-top: 1px dashed rgba(17,24,39,.35); }
  .news a:hover { background: rgba(255,255,255,.35); }
  .news h4 { margin: 0; font-size: 15px; }
  .news p { margin: 2px 0 2px; font-size: 13px; color: var(--muted); font-family: var(--cond); }
  .live-strip { border-color: var(--bronco); }
  @media (max-width: 760px) {

  /* very narrow columns (the site theme pads phones down to ~300px): keep card tabs from colliding */
  @media (max-width: 480px) {

  }

  /* ================= finished games open their own page ================= */
  .game.done { position: relative; }
  .game .stretch { color: inherit; text-decoration: none; }
  .game .stretch::after { content: ""; position: absolute; inset: 0; }
  .game.done:hover .stretch { text-decoration: underline; text-underline-offset: 3px; }
  .game .stretch:focus-visible { outline: none; }

  .game .rowlink, .game .tv { position: relative; z-index: 1; }

  a.gc-last:hover { background: rgba(255,255,255,.6); }

  .crumbs { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin: 24px 0 -12px; font-family: var(--mono); font-size: 13px; font-weight: 700; }

  .gd-h { margin: 0 12px 8px; font-size: 11px; letter-spacing: .06em; color: var(--muted); }
  .sb-h { font-size: 11px; color: var(--muted); }

  /* ================= rosters ================= */
  .ro-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 12px; }

  .ro-coach { display: flex; align-items: center; gap: 10px; min-width: 0; }

  }

  /* ================= full calendar ================= */
  .cal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 28px 0 12px; }
  .cal-head h2 { font-family: var(--mono); font-weight: 700; font-size: clamp(22px, 3.4vw, 32px); letter-spacing: -.02em; margin: 0 6px; min-width: 9ch; }

  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
  .cal-dow { font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 6px 8px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); background: var(--ink); color: var(--bg); }
  .cday { all: unset; box-sizing: border-box; min-height: 112px; padding: 6px 6px 8px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink);

  .cday.today .dn b { background: var(--red); color: #fff; padding: 0 5px; }
  .cday.sel { background: var(--red-tint); box-shadow: inset 0 0 0 2px var(--ink); }
  .ev { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1.2; min-width: 0; }
  .ev .ico { width: 18px; height: 18px; flex: none; }
  .ev .sign { width: 12px; height: 12px; border-width: 1px; box-shadow: none; border-radius: 2px; }
  .ev-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-weight: 600; }
  .ev-r { font-family: var(--mono); font-size: 10px; font-weight: 700; flex: none; }
  .ev-r.W { color: var(--win); } .ev-r.L { color: var(--red); } .ev-r.D { color: var(--brown); }
  .more-ev { font-family: var(--mono); font-size: 10px; font-weight: 700; color: var(--muted); }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin: 10px 0 0; font-family: var(--mono); }
  .cal-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .cal-legend i { font-style: normal; border: 1px solid var(--ink); font-size: 9px; padding: 0 3px; color: var(--ink); font-weight: 700; }
  .day-detail { margin-top: 28px; }
  #view.noanim > * { animation: none; }
  @media (max-width: 760px) {
    .cal-filters { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
    .fchip { flex: none; }
    .cday { min-height: 62px; padding: 4px; }
    .cday .evs { display: flex; flex-wrap: wrap; gap: 2px; }
    .ev-t, .ev-r, .ev .sign, .more-ev { display: none; }
    .ev .ico { width: 20px; height: 20px; }
    .cal-dow { padding: 5px 4px; font-size: 10px; letter-spacing: 0; }
  }

  /* ================= sport icons: hand-inked line art, animated =================
     Each icon idles still and animates on hover, when selected, or in the big hero. */
  .ico { --accent: var(--red); display: block; overflow: hidden; }
  .ico .s { fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .ico .f { fill: var(--accent); }
  .ico .sh { fill: var(--ink); opacity: .18; }
  .ico .ink { fill: var(--ink); }
  .ico * { animation-play-state: paused; transform-box: view-box; }
  .run .ico *, .ico.run *, a:hover .ico *, [aria-current="page"] .ico * { animation-play-state: running; }

  /* basketball: bounce + squash, shadow grows */
  .i-bb .ball { transform-origin: 32px 40px; animation: bb-bounce .55s cubic-bezier(.45,0,.9,.6) infinite alternate; }
  .i-bb .sh { transform-origin: 32px 57px; animation: bb-shadow .55s cubic-bezier(.45,0,.9,.6) infinite alternate; }
  @keyframes bb-bounce { 0% { transform: translateY(-4px); } 85% { transform: translateY(14px) scale(1,1); } 100% { transform: translateY(15px) scale(1.12,.88); } }
  @keyframes bb-shadow { 0% { transform: scale(.55); opacity: .1; } 100% { transform: scale(1); opacity: .25; } }

  /* soccer: rolls back and forth without slipping — 20px of travel on a 14px radius = 82° of spin */
  .i-soc .roll { animation: soc-roll 1.8s cubic-bezier(.45,.05,.55,.95) infinite alternate; }
  .i-soc .spin { transform-origin: 0 0; animation: soc-spin 1.8s cubic-bezier(.45,.05,.55,.95) infinite alternate; }
  @keyframes soc-roll { from { transform: translateX(-10px); } to { transform: translateX(10px); } }
  @keyframes soc-spin { from { transform: rotate(-41deg); } to { transform: rotate(41deg); } }

  /* volleyball: a rally — parabolic arc over the net with top-spin, stays inside the frame */
  .i-vb .ball { transform-origin: 32px 20px; animation: vb-arc 1.5s linear infinite alternate; }
  @keyframes vb-arc {
    0%   { transform: translate(-15px, 7px)  rotate(-120deg); }
    20%  { transform: translate(-9px, 1.5px) rotate(-72deg); }
    40%  { transform: translate(-3px, -1.5px) rotate(-24deg); }
    60%  { transform: translate(3px, -1.5px)  rotate(24deg); }
    80%  { transform: translate(9px, 1.5px)  rotate(72deg); }
    100% { transform: translate(15px, 7px)  rotate(120deg); }
  }

  /* tennis: ball drops in, bounces on the baseline, racket swings through on contact, ball flies out */
  .i-ten .racket { transform-origin: 26px 56px; animation: ten-swing 2.2s infinite; }
  .i-ten .tball { animation: ten-ball 2.2s infinite; }
  .i-ten .tsh { transform-origin: 45px 57.6px; animation: ten-shadow 2.2s infinite; }
  @keyframes ten-swing {
    0%, 34% { transform: rotate(-22deg); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    50% { transform: rotate(12deg); animation-timing-function: ease-out; }
    60% { transform: rotate(20deg); animation-timing-function: ease-in-out; }
    100% { transform: rotate(-22deg); }
  }
  @keyframes ten-ball {
    0% { transform: translate(66px, 4px); opacity: 0; animation-timing-function: ease-in; }
    6% { opacity: 1; }
    30% { transform: translate(45px, 53.3px); animation-timing-function: ease-out; }
    50% { transform: translate(43.5px, 20px); animation-timing-function: cubic-bezier(.2,.6,.4,1); }
    76% { transform: translate(70px, 2px); opacity: 1; }
    77%, 100% { transform: translate(70px, 2px); opacity: 0; }
  }
  @keyframes ten-shadow { 0%, 10% { opacity: 0; transform: scale(.4); } 30% { opacity: .3; transform: scale(1); } 45%, 100% { opacity: 0; transform: scale(.4); } }

  /* golf: ball rolls over the green, slows, drops into the cup; flag ripples */
  .i-golf .flag { transform-origin: 46px 13px; animation: golf-flag .55s ease-in-out infinite alternate; }
  .i-golf .gball { animation: golf-roll 3s infinite; }
  .i-golf .dimple { transform-origin: 0 0; animation: golf-spin 3s infinite; }
  @keyframes golf-flag { from { transform: scaleX(1) skewY(0deg); } to { transform: scaleX(.86) skewY(5deg); } }
  @keyframes golf-roll {
    0% { transform: translate(8px, 47.5px); opacity: 0; animation-timing-function: linear; }
    6% { opacity: 1; }
    20% { transform: translate(16px, 46.4px); animation-timing-function: linear; }
    45% { transform: translate(30px, 45.4px); animation-timing-function: ease-out; }
    70% { transform: translate(44.5px, 46.3px); animation-timing-function: ease-in; }
    76% { transform: translate(46px, 48.6px) scale(.85); opacity: 1; }
    82% { transform: translate(46px, 51px) scale(.5); opacity: 0; }
    100% { transform: translate(46px, 51px) scale(.5); opacity: 0; }
  }
  @keyframes golf-spin { 0% { transform: rotate(0deg); } 70%, 100% { transform: rotate(720deg); } }

  /* water polo: ball bobs half-submerged, front water slides, ripples ring outward */
  .i-wp .ball { transform-origin: 32px 29px; animation: wp-bob 1.3s ease-in-out infinite alternate; }
  .i-wp .wave1 { animation: wp-wave 1.6s linear infinite; }
  .i-wp .wave2 { animation: wp-wave 2.4s linear infinite reverse; }
  .i-wp .rip { transform-origin: 32px 40px; animation: wp-rip 2.4s ease-out infinite; }
  .i-wp .rip2 { animation-delay: -1.2s; }
  @keyframes wp-bob { from { transform: translateY(-1.5px) rotate(-7deg); } to { transform: translateY(2.5px) rotate(7deg); } }
  @keyframes wp-wave { from { transform: translateX(0); } to { transform: translateX(16px); } }
  @keyframes wp-rip { from { transform: scale(.75); opacity: .6; } to { transform: scale(1.5); opacity: 0; } }

  /* baseball: the batter waggles, loads the hands back, then the hands drive forward as the bat whips level through
     the zone. On contact the ball jumps off the barrel; the bat keeps turning and wraps around behind the batter
     (it shortens as it swings away from us) to finish high over the front shoulder, then resets to the stance.
     The bat is drawn from the knob (hands) upward, so translate = where the hands are, rotate = bat angle,
     scaleY = how much of the bat we see. Hands stay above the plate, so the bat never touches the ground. */
  .i-base .bat { transform-origin: 0 0; animation: base-swing 2.4s infinite; }
  .i-base .bball { animation: base-ball 2.4s infinite; }
  .i-base .bspin { transform-origin: 0 0; animation: base-spin .4s linear infinite; }
  .i-base .bsh { transform-origin: 0 0; animation: base-shadow 2.4s infinite; }
  .i-base .pop { transform-origin: 50px 40px; animation: base-pop 2.4s infinite; }
  @keyframes base-swing {
    0%   { transform: translate(23px, 39px) rotate(-26deg) scaleY(1); animation-timing-function: ease-in-out; }
    13%  { transform: translate(23px, 38.5px) rotate(-31deg) scaleY(1); animation-timing-function: ease-in-out; }
    26%  { transform: translate(23px, 39px) rotate(-24deg) scaleY(1); animation-timing-function: ease-in-out; }
    38%  { transform: translate(22px, 37.5px) rotate(-34deg) scaleY(1); animation-timing-function: cubic-bezier(.55,0,.85,.45); }
    44%  { transform: translate(22.5px, 40px) rotate(8deg) scaleY(1); animation-timing-function: linear; }
    48%  { transform: translate(25px, 41px) rotate(86deg) scaleY(1); animation-timing-function: linear; }
    52%  { transform: translate(28px, 40px) rotate(112deg) scaleY(.6); animation-timing-function: linear; }
    56%  { transform: translate(29px, 37px) rotate(190deg) scaleY(.22); animation-timing-function: ease-out; }
    62%  { transform: translate(27px, 34px) rotate(300deg) scaleY(.8); animation-timing-function: ease-in-out; }
    76%  { transform: translate(26px, 34.5px) rotate(306deg) scaleY(.84); animation-timing-function: ease-in-out; }
    100% { transform: translate(23px, 39px) rotate(334deg) scaleY(1); }
  }
  @keyframes base-ball {
    0%, 24% { transform: translate(70px, 27px); opacity: 0; animation-timing-function: linear; }
    27% { opacity: 1; }
    32% { transform: translate(64px, 30px); animation-timing-function: linear; }
    40% { transform: translate(57px, 35px); animation-timing-function: linear; }
    48% { transform: translate(50px, 40.5px); animation-timing-function: cubic-bezier(.1,.75,.35,1); }
    66% { transform: translate(68px, 3px) scale(.7); opacity: 1; }
    67%, 100% { transform: translate(68px, 3px) scale(.7); opacity: 0; }
  }
  @keyframes base-spin { to { transform: rotate(-360deg); } }
  @keyframes base-shadow {
    0%, 25% { transform: translate(70px, 56.5px) scale(.5); opacity: 0; animation-timing-function: linear; }
    32% { transform: translate(64px, 56.5px) scale(.7); opacity: .14; animation-timing-function: linear; }
    48% { transform: translate(50px, 56.5px) scale(1); opacity: .22; animation-timing-function: ease-out; }
    60%, 100% { transform: translate(64px, 56.5px) scale(.3); opacity: 0; }
  }
  @keyframes base-pop { 0%, 47% { transform: scale(.4); opacity: 0; } 49% { transform: scale(1); opacity: 1; } 57%, 100% { transform: scale(1.4); opacity: 0; } }

  /* softball: an underhand pitch rises out of the windmill, peaks, and drops into the glove; the glove gives with
     the catch (squeezes and pulls back), holds the ball for a beat, then lets go for the next pitch */
  .i-soft .glove { transform-origin: 48px 50px; animation: soft-glove 2.4s infinite; }
  .i-soft .sball { animation: soft-arc 2.4s infinite; }
  .i-soft .sspin { transform-origin: 0 0; animation: soft-spin 2.4s infinite; }
  .i-soft .ssh { transform-origin: 0 0; animation: soft-shadow 2.4s infinite; }
  .i-soft .pop { transform-origin: 36px 31px; animation: soft-pop 2.4s infinite; }
  @keyframes soft-arc {
    0%, 6% { transform: translate(5px, 52px) scale(.8); opacity: 0; animation-timing-function: linear; }
    9%  { transform: translate(7px, 47px) scale(.85); opacity: 1; animation-timing-function: linear; }
    15% { transform: translate(10.5px, 37px) scale(.92); animation-timing-function: linear; }
    21% { transform: translate(14.5px, 29.5px); animation-timing-function: linear; }
    27% { transform: translate(19px, 24.5px); animation-timing-function: linear; }
    33% { transform: translate(24px, 22px); animation-timing-function: linear; }
    39% { transform: translate(30px, 22.5px); animation-timing-function: linear; }
    45% { transform: translate(37px, 26px); animation-timing-function: linear; }
    50% { transform: translate(44px, 31.5px); animation-timing-function: cubic-bezier(.2,.8,.4,1); }
    55%, 76% { transform: translate(46.5px, 32.5px); opacity: 1; }
    82%, 100% { transform: translate(46.5px, 32.5px) scale(.9); opacity: 0; }
  }
  @keyframes soft-spin { 0%, 9% { transform: rotate(0deg); animation-timing-function: linear; } 50%, 100% { transform: rotate(-560deg); } }
  @keyframes soft-shadow {
    0%, 8% { transform: translate(7px, 57.5px) scale(1); opacity: 0; animation-timing-function: linear; }
    11% { opacity: .2; }
    33% { transform: translate(24px, 57.5px) scale(.55); opacity: .1; animation-timing-function: linear; }
    50%, 100% { transform: translate(44px, 57.5px) scale(.7); opacity: 0; }
  }
  @keyframes soft-glove {
    0%, 49% { transform: none; }
    52% { transform: translate(2.2px, .6px) rotate(5deg) scale(.96, 1); animation-timing-function: cubic-bezier(.3,0,.3,1); }
    64% { transform: translate(.4px, 0) rotate(1deg); animation-timing-function: ease-in-out; }
    80% { transform: none; }
    100% { transform: none; }
  }
  @keyframes soft-pop { 0%, 49% { transform: scale(.5); opacity: 0; } 51% { transform: scale(1); opacity: .9; } 60%, 100% { transform: scale(1.3); opacity: 0; } }
  /* beach volleyball reuses the volleyball rally; the sun slowly turns */
  .i-bvb .ball { transform-origin: 32px 24px; }
  .i-bvb .sun { transform-origin: 52px 11px; animation: bvb-sun 8s linear infinite; }
  @keyframes bvb-sun { to { transform: rotate(360deg); } }
  /* rowing: oars sweep through the catch and recovery, the shell surges, water slides past */
  .i-row .oar { transform-origin: 22px 35px; animation: row-oar 1.6s ease-in-out infinite; }
  .i-row .oar2 { transform-origin: 36px 35px; }
  .i-row .shell { animation: row-surge 1.6s ease-in-out infinite; }
  .i-row .rwave { animation: wp-wave 1.2s linear infinite reverse; }
  .i-row .rwave2 { animation: wp-wave 1.9s linear infinite reverse; }
  @keyframes row-oar { 0%, 100% { transform: rotate(32deg); } 45% { transform: rotate(-22deg); } }
  @keyframes row-surge { 0%, 100% { transform: translateX(-2px); } 50% { transform: translateX(3px); } }
  /* generic trophy: a small proud bob */
  .i-gen .trophy { transform-origin: 32px 47px; animation: gen-bob 1.4s ease-in-out infinite alternate; }
  @keyframes gen-bob { from { transform: translateY(0) rotate(-3deg); } to { transform: translateY(-3px) rotate(3deg); } }

  /* resting pose: start each story mid-play so a paused icon still shows the ball */
  .i-base .bat, .i-base .bball, .i-base .bsh, .i-base .pop { animation-delay: -.95s; }
  .i-soft .glove, .i-soft .sball, .i-soft .sspin, .i-soft .ssh, .i-soft .pop { animation-delay: -.9s; }
  .i-ten .racket, .i-ten .tball, .i-ten .tsh { animation-delay: -.95s; }
  .i-golf .gball, .i-golf .dimple { animation-delay: -1.2s; }

  /* calendar: highlight hops from day to day */
  .i-cal .calhi { animation: cal-hop 2.4s infinite; }
  @keyframes cal-hop {
    0%, 18% { transform: translate(0, 0); } 25%, 43% { transform: translate(18px, 0); }
    50%, 68% { transform: translate(27px, 9px); } 75%, 93% { transform: translate(9px, 18px); } 100% { transform: translate(0, 0); }
  }

  /* cross country / track: stopwatch hand sweeps, speed lines streak */
  .i-xc .hand { transform-origin: 34px 37px; animation: xc-hand 1.6s linear infinite; }
  .i-xc .speed { animation: xc-speed .6s linear infinite; }
  .i-xc .speed:nth-of-type(2) { animation-delay: -.2s; } .i-xc .speed:nth-of-type(3) { animation-delay: -.4s; }
  @keyframes xc-hand { to { transform: rotate(360deg); } }
  @keyframes xc-speed { 0% { transform: translateX(6px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(-8px); opacity: 0; } }

  /* "all sports" icon: little pennant flag flutters */
  .i-all .pen { transform-origin: 16px 14px; animation: golf-flag .45s ease-in-out infinite alternate; }

  /* ---------- border / hover polish ---------- */
  :root { --ease: cubic-bezier(.2, .8, .2, 1); }
  /* sport tabs: red rule slides in from the left on hover; ink fill eases in when selected */
  .rail a { transition: background-color .25s var(--ease), color .25s var(--ease); }
  .rail a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--red);
    transform: scaleX(0); transform-origin: left; transition: transform .3s var(--ease); }
  .rail a:hover::after { transform: scaleX(1); }
  .rail a[aria-current="page"]::after { transform: scaleX(1); background: var(--red); }
  .rail .ico, .tile-head .ico, .wk .ico { transition: transform .3s var(--ease); }
  .rail a:hover .ico { transform: translateY(-2px); }
  /* cards: lift with a hard offset shadow, header rule turns red */
  .tile { transition: transform .25s var(--ease), box-shadow .25s var(--ease); }
  .tile-head { transition: border-color .25s var(--ease); }
  .tile:hover .tile-head { border-bottom-color: var(--red); }
  .tile:hover .tile-head .ico { transform: scale(1.06); }
  .wk { position: relative; transition: background-color .2s var(--ease); }
  .wk::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--red); transform: scaleX(0);
    transform-origin: left; transition: transform .3s var(--ease); }
  .wk:hover::before { transform: scaleX(1); }
  /* buttons and toggles */
  .seg a, .listen, .chip, .more, .panel a { transition: background-color .2s var(--ease), color .2s var(--ease); }
  .listen { box-shadow: 0 0 0 var(--ink); transition: box-shadow .2s var(--ease), transform .2s var(--ease), background-color .2s, color .2s; }
  .listen:hover { transform: translate(-2px, -2px); box-shadow: 2px 2px 0 var(--ink); }
  .game { transition: background-color .2s var(--ease); }
  .game:hover { background: rgba(255,255,255,.35); }
  /* view swap: new sport page fades up */
  #view > * { animation: view-in .35s var(--ease) both; }
  #view > *:nth-child(2) { animation-delay: .05s; } #view > *:nth-child(3) { animation-delay: .1s; }
  @keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    #view > * { animation: none !important; }
    .navdrop .panel, .navdrop.open .panel { transition: none; transform: none; }
    .rail a::after, .wk::before, .listen, .tile { transition: none; } .ico * { animation: none !important; } .tile, .tile:hover { transform: none; } }

  /* ================= responsive ================= */
  @media (max-width: 900px) {
    .hero { grid-template-columns: auto 1fr; }
    .hero-next { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--ink); }
  }
  @media (max-width: 760px) {
    .grid2 { grid-template-columns: 1fr; }
    .topbar .row { flex-wrap: wrap; }
    .topbar nav { gap: 10px; font-size: 14px; margin-left: 0; flex-wrap: wrap; }
    .topbar .hide-sm { display: none; }
    .navdrop .panel { position: fixed; left: 16px; right: 16px; top: 92px; width: auto; }
    .hero { grid-template-columns: 1fr; }
    .hero-ico { border-right: 0; border-bottom: 1px solid var(--ink); justify-content: center; }
    .hero-ico .ico { width: 96px; height: 96px; }
    .rail { grid-template-columns: repeat(3, 1fr); }
    .rail .ico { width: 34px; height: 34px; }
    .rail a { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- Stand-in for the site's real header. In Hugo, the theme draws this and we'd add the dropdown there. -->
  <header class="topbar">
    <a class="logo" href="https://kscu.org"><img src="kscu_logo.svg" alt="KSCU"></a>
    <div class="rows">
      <div class="row"><b>LIVE</b> <span class="dot"></span> <span class="hide-sm"><b>KSCU 103.3 FM</b> — The Underground Sound</span>
        <nav>
          <a href="#">Blog</a><a href="#">Schedule</a>
          <div class="navdrop" id="navdrop">
            <button class="active" aria-haspopup="true" aria-expanded="false" id="navdrop-btn">Sports ▾</button>
            <div class="panel" id="navdrop-panel"></div>
          </div>
          <a href="#">PSAs</a><a href="#">About</a>
        </nav>
      </div>
      <div class="row"><b>PLAYING</b> <span class="mono">Bronco play-by-play — KSCU Sports</span></div>
    </div>
  </header>

  <h1 class="title">KSCU SPORTS</h1>

  <!-- Sport sub-menu -->
  <nav class="rail" id="rail" aria-label="Sports"></nav>

  <div class="score-tools" hidden>
    <button type="button" id="ks-refresh-scores" disabled>↻ Refresh scores</button>
    <span id="ks-refresh-status" role="status"></span>
  </div>
  <div class="live-strip" id="live-strip"></div>

  <main id="view"><div class="empty" style="margin:28px 0">Loading the Bronco calendar…</div></main>

  <footer id="footer"></footer>
</div>

<script>
// ---------------------------------------------------------------------------
// DATA
// 1) Full schedule for every sport: Santa Clara Athletics' public calendar,
//    turned into JSON by build_snapshot.py. On the real site the KSCU API server
//    would serve this same JSON (e.g. GET /sports/schedule).
// 2) In-game scores for basketball + volleyball: straight from ESPN.
// ---------------------------------------------------------------------------
const SCHEDULE_URL = "scu-schedule.json"; // copy built into the site (refreshed weekly), used if GitHub is unreachable
// hourly copy written by the "Refresh sports schedule" GitHub Action to the sports-data branch; no site rebuild needed
const LIVE_SCHEDULE_URL = "https://raw.githubusercontent.com/GrantSwanson117/kscu-site/sports-data/scu-schedule.json";
const ROSTER_URL = "rosters.json"; // players + coaches from SCU's roster pages, refreshed twice a year
const ESPN_TEAM_ID = 2541; // Santa Clara on ESPN
const ESPN_FEEDS = {
  "Men's Basketball":   "basketball/mens-college-basketball",
  "Women's Basketball": "basketball/womens-college-basketball",
  "Women's Volleyball": "volleyball/womens-college-volleyball",
  "Baseball":           "baseball/college-baseball",   // spring
  "Softball":           "baseball/college-softball",   // spring (ESPN files softball under baseball)
};
// ESPN uses a different Santa Clara team id in some sports
const ESPN_IDS = { "Baseball": "427", "Softball": "781" };
const espnTeamId = sport => ESPN_IDS[sport] || String(ESPN_TEAM_ID);
const PAGE = 6;

// All 18 SCU teams grouped into sports (the sub-menu). Order = menu order; only sports
// with games on the calendar get a tab, so spring sports appear on their own in spring.
// "Beach Volleyball" must come before "Volleyball" so it isn't swallowed by it.
const SPORTS = [
  { id: "basketball", name: "Basketball",  match: "Basketball" },
  { id: "soccer",     name: "Soccer",      match: "Soccer" },
  { id: "beach-volleyball", name: "Beach", match: "Beach Volleyball" },
  { id: "volleyball", name: "Volleyball",  match: "Volleyball" },
  { id: "water-polo", name: "Water Polo",  match: "Water Polo" },
  { id: "baseball",   name: "Baseball",    match: "Baseball" },
  { id: "softball",   name: "Softball",    match: "Softball" },
  { id: "tennis",     name: "Tennis",      match: "Tennis" },
  { id: "golf",       name: "Golf",        match: "Golf" },
  { id: "rowing",     name: "Rowing",      match: "Rowing" },
  { id: "xc",         name: "XC / Track",  match: "Cross Country" },
];

let games = [], live = {}, shown = {};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const when = g => g.allDay ? new Date(g.start + "T12:00:00") : new Date(g.start);
const fmtTime = g => g.allDay ? "All day" : when(g).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
const fmtLong = g => when(g).toLocaleDateString("en-US", { weekday: "long", month: "short", day: "numeric" });
// Tournament rounds ("First Round", "WCC Championship") aren't opponents, so show them as-is.
const isRound = o => /^(first|second|third) round$|final|championship$/i.test(o);
const versus = g => g.meet || isRound(g.opponent) ? g.opponent : (g.home || g.neutral ? "vs " : "at ") + g.opponent;
// Home = played in Santa Clara; neutral = "vs" somewhere else (tournaments, showcases); everything else is away.
const venueOf = g => /Santa Clara/.test(g.location || "") ? "home" : g.neutral ? "neutral" : "away";
const VENUE = { home: "HOME", away: "AWAY", neutral: "NEUTRAL" };
const venueTag = (g, mini = false) => { const v = venueOf(g);
  return `<span class="vb ${v}${mini ? " mini" : ""}" title="${VENUE[v].toLowerCase()} game">${mini ? VENUE[v][0] : VENUE[v]}</span>`; };
// Unknown sports (anything SCU adds later) get registered on the fly with a generic icon, so they can never break the page.
const sportOf = name => {
  name = String(name || "");
  let s = SPORTS.find(x => name.includes(x.match));
  if (!s) {
    const base = name.replace(/^(Men's|Women's)\s+/, "").trim() || "Other";
    s = SPORTS.find(x => x.match === base);
    if (!s) { s = { id: "x-" + base.toLowerCase().replace(/[^a-z0-9]+/g, "-"), name: base, match: base, generic: true }; SPORTS.push(s); }
  }
  return s;
};
// "Baseball" and "Softball" have no Men's/Women's prefix in SCU's calendar
const genderOf = name => /^Women's/.test(name) ? "womens" : /^Men's/.test(name) ? "mens"
  : /Softball/i.test(name) ? "womens" : "mens";

const teamName = (sportId, g) => {
  const full = games.find(x => sportOf(x.sport)?.id === sportId && genderOf(x.sport) === g)?.sport ?? "";
  return full || springTeams[sportId]?.[g] || SPORTS.find(x => x.id === sportId)?.name || "";
};
const teamGames = (sportId, g) => games.filter(x => sportOf(x.sport)?.id === sportId && (!g || genderOf(x.sport) === g));
