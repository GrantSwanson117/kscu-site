  "water-polo": { womens: "Women's Water Polo" },
};
const hasTeam = (id, gender) => Boolean(springTeams[id]?.[gender] || teamGames(id, gender).length);
const hasSport = s => hasTeam(s.id, "mens") || hasTeam(s.id, "womens");
const isScheduled = s => teamGames(s.id).some(isUpcoming) || liveEvents().some(e => sportOf(e.sport)?.id === s.id);
const menuSports = () => SPORTS.filter(hasSport).sort((a, b) => Number(isScheduled(b)) - Number(isScheduled(a)));
const isUpcoming = g => !g.result && when(g).getTime() > Date.now() - 3 * 3600e3;
const upcomingOf = arr => arr.filter(isUpcoming);
const resultsOf = arr => arr.filter(g => g.result).reverse();
const href = (sport, g) => sport ? `#/${sport}${g ? "/" + g : ""}` : "#/";

function formBlocks(results, n = 8, big = false, linked = false) {
  if (!results.length) return "";
  return `<div class="form ${big ? "lg" : ""}" aria-label="Recent results">${results.slice(0, n).reverse().map(g => {
    const k = g.result[0];
    if (linked && isFinal(g)) return `<a class="${k}" href="${gameHref(g)}" title="${esc(versus(g) + " — " + g.result)}">${k}</a>`;
    if ("WLD".includes(k) && /^[WLD] \d/.test(g.result)) return `<i class="${k}" title="${esc(versus(g) + " — " + g.result)}">${k}</i>`;
    return `<i title="${esc(g.opponent + " — " + g.result)}">${esc(g.result.split(" of")[0])}</i>`;
  }).join("")}</div>`;
}
function record(results) {
  const r = { W: 0, L: 0, D: 0 };
  results.forEach(g => { if (/^[WLD] \d/.test(g.result)) r[g.result[0]]++; });
  return r;
}

// Finished head-to-head games get their own page (#/game/<SCU game id>), like ESPN's game pages
const isFinal = g => !g.meet && /^[WLD] \d+-\d+/.test(g.result || "");
const gameKey = g => g.id || `${g.start.slice(0, 10)}-${sportOf(g.sport).id}-${genderOf(g.sport)}-${String(g.opponent).toLowerCase().replace(/[^a-z0-9]+/g, "-")}`;
const gameHref = g => `#/game/${gameKey(g)}`;

function gameRow(g, withSport) {
  const d = when(g);
  const e = typeof espnFor === "function" ? espnFor(g) : null;
  const played = g.result || d.getTime() < Date.now() - 3 * 3600e3;
  const scuLink = g.boxscore ? [g.boxscore, "BOX SCORE"] : g.recap ? [g.recap, "RECAP"] : null; // from SCU's schedule page
  const extra = e && g.result && e.completed
      ? `<a class="rowlink" href="${espnGameUrl(e)}" target="_blank" rel="noopener">${ESPN_SB[g.sport] ? "MATCH" : "BOX SCORE"} ↗</a>`
    : played && scuLink ? `<a class="rowlink" href="${esc(scuLink[0])}" target="_blank" rel="noopener">${scuLink[1]} ↗</a>`
    : e?.tv ? `<span class="tv">${esc(e.tv)}</span>` : "";
  const vs = versus(g), pre = vs.match(/^(vs|at) /)?.[0] || "", oppLogo = e?.them?.logo || g.logo;
  const res = (g.result ? `<div class="res ${g.result[0]}">${esc(g.result)}` : `<div class="res">${esc(fmtTime(g))}`) + `${extra ? `<div>${extra}</div>` : ""}</div>`;
  const fin = isFinal(g), name = esc(vs.slice(pre.length));
  return `<div class="game${fin ? " done" : ""}">
    <div class="cal"><div class="m">${d.toLocaleDateString("en-US", { month: "short" }).toUpperCase()}</div>
      <div class="d">${d.getDate()}</div><div class="w">${d.toLocaleDateString("en-US", { weekday: "short" })}</div></div>
    <div><div class="opp">${esc(pre)}${oppLogo ? `<img class="tlogo xs" src="${esc(oppLogo)}" alt="" loading="lazy">` : ""}${fin ? `<a class="stretch" href="${gameHref(g)}">${name}</a>` : name}${venueTag(g)}</div>
      <div class="meta">${withSport ? esc(g.sport) + " · " : ""}${esc(g.location)}</div></div>
    ${res}</div>`;
}
function gameList(id, arr, emptyMsg, withSport) {
  shown[id] ??= PAGE;
  if (!arr.length) return `<div class="empty">${emptyMsg}</div>`;
  return arr.slice(0, shown[id]).map(g => gameRow(g, withSport)).join("") +
    (arr.length > shown[id] ? `<button class="more" data-more="${id}">SHOW MORE ↓</button>` : "");
}
function nextCard(g, withIcon = true) {
  if (!g) return `<div class="empty">Nothing on the calendar yet.</div>`;
  const s = sportOf(g.sport);
  return `<div class="pad"><div class="next-wrap">${withIcon ? icon(s.id, "run") : ""}<div>
      <p class="big">${esc(versus(g))}</p><p class="sub">${esc(g.sport)}${venueTag(g)}</p>
      <div class="meta">${esc(g.location)}</div></div></div></div>
    <div class="when">${esc(fmtLong(g))} · ${esc(fmtTime(g))}</div>`;
}

// ---------------------------------------------------------------------------
// MENUS
// ---------------------------------------------------------------------------
function buildMenus() {
  const present = menuSports();
  document.getElementById("rail").innerHTML =
    `<a href="#/" data-sport="">${icon("all")}All Sports</a>` +
    present.map(s => `<a href="${href(s.id)}" data-sport="${s.id}">${icon(s.id)}${esc(s.name)}</a>`).join("") +
    `<a href="#/calendar" data-sport="calendar">${icon("cal")}Calendar</a>`;
  const tabs = present.length + 2;
  document.getElementById("rail").style.setProperty("--cols", tabs <= 10 ? tabs : Math.ceil(tabs / 2));

  const col = g => `<div><h4>${GENDERS[g].toUpperCase()}</h4>${present.filter(s => hasTeam(s.id, g))
    .map(s => `<a href="${href(s.id, g)}" data-nav="${s.id}/${g}">${icon(s.id)}${esc(s.name)}</a>`).join("")}</div>`;
  document.getElementById("navdrop-panel").innerHTML = col("mens") + col("womens") +
    `<div class="panel-foot"><a class="all" href="#/" data-nav="overview">All sports →</a><a class="all" href="#/calendar" data-nav="calendar">Full calendar →</a></div>`;
}

// ---------------------------------------------------------------------------
// VIEWS
// ---------------------------------------------------------------------------
function overview() {
  const up = upcomingOf(games);
  // This week: next 7 days of games
  const end = Date.now() + 7 * 864e5;
  const week = up.filter(g => when(g).getTime() < end);
  const todayStr = new Date().toDateString();
  const weekHtml = week.length ? week.map(g => {
    const s = sportOf(g.sport), d = when(g);
    const isLive = espnFor(g)?.state === "in";
    return `<a class="wk g-${genderOf(g.sport)} ${d.toDateString() === todayStr ? "today" : ""}" href="${href(s.id, genderOf(g.sport))}">
      <div class="day"><span>${isLive ? "LIVE NOW" : d.toDateString() === todayStr ? "TODAY" : d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase()}</span><span>${esc(fmtTime(g))}</span></div>
      ${icon(s.id)}<div class="opp">${esc(versus(g))}</div><div class="meta">${esc(g.sport)}</div><div>${venueTag(g).replace('class="vb', 'style="margin-left:0" class="vb')}</div></a>`;
  }).join("") : `<div class="empty">No games in the next 7 days.</div>`;

  // Team tiles: per team, the last game in a box (played = boxed, links to its game page) and the next game as
  // plain text (upcoming = unboxed). The tile links to the sport page through its title (stretched over the tile),
  // so the last-game box can be its own link.
  const md = g => when(g).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const lastChip = g => {
    if (isFinal(g)) { const k = g.result[0];
      return `<a class="lchip" href="${gameHref(g)}" aria-label="${esc(`${g.result} ${versus(g)}, ${md(g)}: game details`)}"><i class="lsq ${k}">${k}</i>
        <b>${esc(g.result.slice(2).replace("-", "–"))}</b><span class="lc-opp${g.logo ? " has-logo" : ""}">${g.logo ? `<img src="${esc(g.logo)}" alt="" loading="lazy">` : ""}<span class="nm">${esc(g.opponent)}</span></span><span class="lc-date">${md(g)}</span></a>`; }
    const [place, ...rest] = g.result.split(" "); // placings, e.g. "3rd of 12"
    const inner = `<i class="lsq pl">${esc(place)}</i><span class="lc-opp">${esc([rest.join(" "), g.opponent].filter(Boolean).join(" · "))}</span><span class="lc-date">${md(g)}</span>`;
    return g.boxscore ? `<a class="lchip" href="${esc(g.boxscore)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="lchip">${inner}</div>`;
  };
  const tiles = menuSports().map(s => {
    const rows = ["mens", "womens"].filter(g => hasTeam(s.id, g)).map(g => {
      const tg = teamGames(s.id, g), nx = upcomingOf(tg)[0], last = resultsOf(tg)[0];
      // nothing played and nothing scheduled (off-season): one quiet line instead of two empty states
      const body = !last && !nx ? `<div class="line next"><span>No games listed yet</span></div>`
        : (last ? lastChip(last) : "") + `<div class="line next">${nx ? `<b>NEXT</b>${esc(versus(nx))}${venueTag(nx)} <span>· ${md(nx)}</span>` : `<span>No upcoming games listed</span>`}</div>`;
      return `<div class="tile-row">${sign(g)}<div class="tr-body">${body}</div></div>`;
    }).join("");
    return `<div class="tile"><div class="tile-head">${icon(s.id)}<h3><a class="tile-link" href="${href(s.id)}">${esc(s.name)}</a></h3></div>${rows}</div>`;
  }).join("");

  return `
    ${onAirBar()}
    ${(() => { const lv = liveEvents()[0], fin = lv ? null : heldFinal(games, up);
      return `<div class="card featured${lv ? " live-card" : ""}">
        ${lv ? `<div class="live-card-head"><div class="tab-live"><span class="dot pulse"></span> LIVE · BOX SCORE</div><span class="mono">Updates every 15s</span></div>`
             : `<div class="tab">${fin ? "FINAL SCORE" : "NEXT BRONCOS GAME"}</div><div class="tab right">(ง •̀_•́)ง</div>`}
        <div class="box gc wide">${lv ? liveCenter(lv) : fin ? finalCenter(fin, up[0]) : preCenter(up[0])}</div></div>`; })()}
    <div class="card section-gap"><div class="tab">THIS WEEK</div><a class="tab right mono" href="#/calendar" style="text-decoration:none">${week.length} game${week.length === 1 ? "" : "s"} · FULL CALENDAR →</a><div class="week">${weekHtml}</div></div>
    <div class="card teams"><div class="tab">TEAMS</div><div class="tiles">${tiles}</div></div>`;
}

function sportPage(sportId, gender) {
  const s = SPORTS.find(x => x.id === sportId);
  const avail = ["mens", "womens"].filter(g => hasTeam(sportId, g));
  if (!s || !avail.length) return overview();
  if (!avail.includes(gender)) {
    // default to whichever team plays soonest
    gender = avail.slice().sort((a, b) => (upcomingOf(teamGames(sportId, a))[0] ? when(upcomingOf(teamGames(sportId, a))[0]) : Infinity) -
                                          (upcomingOf(teamGames(sportId, b))[0] ? when(upcomingOf(teamGames(sportId, b))[0]) : Infinity))[0];
  }
  current.resolved = gender; // so the menu can mark the team actually shown
  const tg = teamGames(sportId, gender), up = upcomingOf(tg), res = resultsOf(tg), rec = record(res);
  const isMeet = tg.some(g => g.meet) && !tg.some(g => !g.meet);
  const sportName = teamName(sportId, gender);
  const liveEv = liveEvents().find(e => e.sport === sportName);
  const liveNow = liveEv ? `${liveEv.us.abbr} ${liveEv.us.score || "—"} – ${liveEv.them.score || "—"} ${liveEv.them.abbr}` : "";
  const et = espn.team[sportName]; // official season record + conference standing from ESPN, when covered
  const recStat = et?.record
    ? `<div class="stat season"><b>${esc(et.record)}</b><span>SEASON</span></div>${et.standing ? `<div class="stat rank"><b>${esc(et.standing.split(" ")[0])}</b><span>${esc(et.standing.split(" ").slice(1).join(" ").toUpperCase())}</span></div>` : ""}${et.conf ? `<div class="stat conf"><b>${esc(et.conf)}</b><span>WCC RECORD</span></div>` : ""}${et.streak && et.streak !== "-" ? `<div class="stat streak ${esc(et.streak[0])}"><b>${esc(et.streak)}</b><span>STREAK</span></div>` : ""}`
    : `<div class="stat season"><b>${rec.W}–${rec.L}${rec.D ? "–" + rec.D : ""}</b><span>RECENT W–L${rec.D ? "–D" : ""}</span></div>`;
  if (ESPN_FEEDS[sportName]) loadNews(sportName);
  const stats = isMeet
    ? `<div class="stat season"><b>${res.length}</b><span>EVENTS</span></div><div class="stat sched"><b>${up.length}</b><span>UPCOMING</span></div>`
    : `${recStat}<div class="stat sched"><b>${up.length}</b><span>UPCOMING</span></div>
       <div class="stat sched"><b>${up.filter(g => venueOf(g) === "home").length}<small style="opacity:.45"> / </small>${up.filter(g => venueOf(g) !== "home").length}</b><span>HOME / AWAY LEFT</span></div>`;
  shown = {};

  return `
    ${liveEv ? `<div class="card live-card" style="margin-top:28px"><div class="live-card-head"><div class="tab-live"><span class="dot pulse"></span> LIVE · BOX SCORE</div><span class="mono">Updates every 15s</span></div><div class="box gc">${liveCenter(liveEv)}</div></div>` : ""}
    <section class="hero run g-${gender}">
      <div class="hero-ico">${icon(sportId)}</div>
      <div class="hero-main">
        <h2>${esc(teamName(sportId, gender))}</h2>
        ${avail.length > 1 ? `<div class="seg" role="group" aria-label="Team">${avail.map(g =>
          `<a href="${href(sportId, g)}" aria-current="${g === gender}">${GENDERS[g].toUpperCase()}</a>`).join("")}</div>` : `<div style="height:14px"></div>`}
        <div class="stats">${stats}</div>
        ${res.length ? `<div style="margin-top:14px"><div class="meta" style="font-weight:700;letter-spacing:.05em">RECENT FORM</div>${formBlocks(res, 10, true, true)}</div>` : ""}
        <a class="listen" href="https://mixlr.com/kscusports" target="_blank" rel="noopener"><span class="dot ${liveNow ? "pulse" : ""}"></span>${liveNow ? "LIVE NOW · " + esc(liveNow) : "KSCU PLAY-BY-PLAY ON MIXLR ↗"}</a>
      </div>
      ${(() => { const fin = liveEv ? null : heldFinal(tg, up);
        return `<div class="hero-next gc"><div class="lbl"><span>${fin ? "FINAL" : "NEXT UP"}</span><span>(ง •̀_•́)ง</span></div>${fin ? finalCenter(fin, up[0]) : preCenter(up[0], true) + lastResult(res[0])}</div>`; })()}
    </section>
    <div class="grid2 ${ESPN_FEEDS[sportName] ? "" : "section-gap"}" style="margin-top:0">
      <div class="card"><div class="tab">UPCOMING</div><div class="tab right mono">${up.length}</div><div class="box" id="upcoming">${gameList("upcoming", up, "No games on the calendar yet.")}</div></div>
      <div class="card"><div class="tab">RESULTS</div><div class="tab right mono">${res.length}</div><div class="box" id="results">${gameList("results", res, "No results yet this season.")}</div></div>
    </div>
    ${ESPN_FEEDS[sportName] ? `<div class="card section-gap" style="margin-top:28px"><div class="tab">HEADLINES</div><div class="tab right mono">via ESPN</div>
      <div class="box news" id="news" data-sport="${esc(sportName)}">${newsList(sportName)}</div></div>`
      : officialLinks(sportId, gender)}
    ${rosterCard(rosterSlug(sportId, gender))}`;
}

// Sports ESPN doesn't cover. SCU Athletics posts their live stats on StatBroadcast and results on its own site
// (box scores, PDFs, regatta pages). None of those can be embedded or read by this page (they block framing and
// cross-site requests), so we link straight to the official pages instead.
const SCU_SITE = "https://santaclarabroncos.com/sports";
const SCU_LIVE_STATS = "https://www.statbroadcast.com/events/statmonitr.php?gid=sacl";
const OFFICIAL = {
  "water-polo":       "Box score for every match",
  "tennis":           "Match-by-match results",
  "golf":             "Tournament leaderboards (PDF)",
  "rowing":           "Regatta results",
  "beach-volleyball": "Box score for every match (PDF)",
  "xc":               "Meet results (PDF)",
};
function officialLinks(sportId, gender) {
  if (!OFFICIAL[sportId]) return "";
  const slug = `${gender}-${sportId === "xc" ? "cross-country" : sportId}`;
  const g = gender === "womens" ? "f" : "m";
  const link = (url, title, desc) => `<a href="${url}" target="_blank" rel="noopener"><h4>${esc(title)} ↗</h4><p>${esc(desc)}</p></a>`;
  return `<div class="card section-gap" style="margin-top:28px"><div class="tab">OFFICIAL RESULTS &amp; LIVE STATS</div><div class="tab right mono">via SCU Athletics</div>
    <div class="box news">
      ${link(`${SCU_SITE}/${slug}/schedule`, "Schedule & results", OFFICIAL[sportId] + ", on santaclarabroncos.com")}
      ${link(SCU_LIVE_STATS, "Live stats", "StatBroadcast, during games SCU tracks live")}
      ${sportId === "xc" ? link(`https://www.tfrrs.org/teams/xc/CA_college_${g}_Santa_Clara.html`, "Cross country results", "Every meet on TFRRS")
        + link(`https://www.tfrrs.org/teams/tf/CA_college_${g}_Santa_Clara.html`, "Track & field results", "Every meet on TFRRS") : ""}
    </div></div>`;
}

// ---------------------------------------------------------------------------
// FULL CALENDAR (#/calendar or #/calendar/2026-12)
// ---------------------------------------------------------------------------
const cal = { sport: "all", gender: "all", selected: null };
const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const ymOf = d => dkey(d).slice(0, 7);
const SUBSCRIBE_URL = "webcal://santaclarabroncos.com/calendar.ashx/calendar.ics"; // opens in Apple/Google/Outlook calendar

function calendarPage(ym) {
  const now = new Date();
  const [y, m] = /^\d{4}-\d{2}$/.test(ym || "") ? ym.split("-").map(Number) : [now.getFullYear(), now.getMonth() + 1];
  const first = new Date(y, m - 1, 1), daysIn = new Date(y, m, 0).getDate();
  const weeks = Math.ceil((first.getDay() + daysIn) / 7);
  const start = new Date(y, m - 1, 1 - first.getDay());
  const prev = ymOf(new Date(y, m - 2, 1)), next = ymOf(new Date(y, m, 1));

  const shownGames = games.filter(g => (cal.sport === "all" || sportOf(g.sport)?.id === cal.sport) &&
                                       (cal.gender === "all" || genderOf(g.sport) === cal.gender));
  const byDay = {};
  shownGames.forEach(g => (byDay[dkey(when(g))] ??= []).push(g));

  // which day's details to show: keep the clicked day if it's in this month, else today, else the first game day
  const monthKey = `${y}-${String(m).padStart(2, "0")}`;
  let sel = cal.selected?.startsWith(monthKey) ? cal.selected : null;
  if (!sel) sel = ymOf(now) === monthKey ? dkey(now) : (Object.keys(byDay).filter(k => k.startsWith(monthKey)).sort()[0] || `${monthKey}-01`);
  cal.selected = sel;

  const short = g => g.meet || isRound(g.opponent) ? g.opponent : (g.home || g.neutral ? "vs " : "@ ") + g.opponent;
  const evChip = g => {
    const r = g.result ? (/^[WLD] \d/.test(g.result) ? g.result[0] : g.result.split(" of")[0]) : fmtTime(g).replace(":00", "").replace(" ", "").toLowerCase();
    return `<span class="ev" title="${esc(g.sport + " · " + versus(g) + (g.result ? " · " + g.result : " · " + fmtTime(g)))}">
      ${icon(sportOf(g.sport).id)}${sign(genderOf(g.sport))}${venueTag(g, true)}<span class="ev-t">${esc(short(g))}</span>
      <span class="ev-r ${g.result ? g.result[0] : ""}">${esc(r)}</span></span>`;
  };

  let cells = "";
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = dkey(d), list = byDay[k] || [];
    const cls = [d.getMonth() !== m - 1 && "out", k === dkey(now) && "today", k === sel && "sel"].filter(Boolean).join(" ");
    cells += `<button class="cday ${cls}" data-day="${k}" aria-label="${d.toDateString()}: ${list.length} game${list.length === 1 ? "" : "s"}">
      <span class="dn"><b>${d.getDate()}</b></span>
      <span class="evs">${list.slice(0, 3).map(evChip).join("")}${list.length > 3 ? `<span class="more-ev">+${list.length - 3} more</span>` : ""}</span></button>`;
  }

  const sportsPresent = SPORTS.filter(hasSport);
  const chip = (attr, val, label, cur, ic = "") => `<button class="fchip" data-${attr}="${val}" aria-pressed="${cur === val}">${ic}${label}</button>`;
  const selDate = new Date(sel + "T12:00:00");
  const dayGames = byDay[sel] || [];
  const monthCount = Object.entries(byDay).filter(([k]) => k.startsWith(monthKey)).reduce((n, [, v]) => n + v.length, 0);

  return `
    <div class="cal-head">
      <a class="sq" href="#/calendar/${prev}" aria-label="Previous month">‹</a>
      <h2>${first.toLocaleDateString("en-US", { month: "long", year: "numeric" })}</h2>
      <a class="sq" href="#/calendar/${next}" aria-label="Next month">›</a>
      <a class="sq wide" href="#/calendar/${ymOf(now)}">TODAY</a>
      <span class="spacer"></span>
      <span class="mono" style="font-size:13px;font-weight:700">${monthCount} game${monthCount === 1 ? "" : "s"}</span>
      <a class="listen" style="margin:0" href="${SUBSCRIBE_URL}">＋ SUBSCRIBE TO BRONCOS CALENDAR</a>
    </div>
    <div class="cal-filters" role="group" aria-label="Filter calendar">
      ${chip("calsport", "all", "ALL", cal.sport, icon("all"))}
      ${sportsPresent.map(s => chip("calsport", s.id, esc(s.name).toUpperCase(), cal.sport, icon(s.id))).join("")}
      <span class="fsep"></span>
      ${chip("calgender", "all", "BOTH", cal.gender)}${chip("calgender", "mens", "MEN'S", cal.gender, sign("mens"))}${chip("calgender", "womens", "WOMEN'S", cal.gender, sign("womens"))}
    </div>
    <div class="cal-grid">${["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"].map(d => `<div class="cal-dow">${d}</div>`).join("")}${cells}</div>
    <div class="cal-legend"><span><span class="vb home mini">H</span> home</span><span><span class="vb away mini">A</span> away</span><span><span class="vb neutral mini">N</span> neutral site</span>
      <span style="color:var(--win)">W win</span><span style="color:var(--red)">L loss</span><span style="color:var(--brown)">D draw</span><span>2nd = finish place</span><span>Tap a day for details</span></div>
    <div class="card day-detail section-gap">
      <div class="tab">${selDate.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" }).toUpperCase()}</div>
      <div class="tab right mono">${dayGames.length} game${dayGames.length === 1 ? "" : "s"}</div>
      <div class="box">${dayGames.length ? dayGames.map(g => gameRow(g, true)).join("") : `<div class="empty">No Bronco games this day.</div>`}</div>
    </div>`;
}

// ===========================================================================
// ESPN — free, no API key, readable straight from the browser. Covers SCU men's &
// women's basketball, volleyball, soccer, baseball and softball. Refreshes on its own: every 60s
// normally, every 15s during game time (see gameTime below).
// ===========================================================================
const ESPN_BASE = "https://site.api.espn.com/apis/site/v2/sports";
const WCC_GROUP = 29; // West Coast Conference in ESPN's standings
const SCU_LOGO = "https://a.espncdn.com/i/teamlogos/ncaa/500/2541.png";
const ESPN_WEB = { "Men's Basketball": "mens-college-basketball", "Women's Basketball": "womens-college-basketball", "Women's Volleyball": "womens-college-volleyball", "Baseball": "college-baseball", "Softball": "college-softball" };
// College soccer: ESPN's per-team schedule is broken, but its daily scoreboard works — and soccer uses its own team ids.
const ESPN_SB = { "Women's Soccer": { path: "soccer/usa.ncaa.w.1", id: "20312" }, "Men's Soccer": { path: "soccer/usa.ncaa.m.1", id: "5588" } };
const espnPath = sport => ESPN_FEEDS[sport] || ESPN_SB[sport]?.path;
const espnGameUrl = e => ESPN_SB[e.sport] ? `https://www.espn.com/soccer/match/_/gameId/${e.id}` : `https://www.espn.com/${ESPN_WEB[e.sport]}/game/_/gameId/${e.id}`;
const espn = { events: {}, team: {}, summary: {}, news: {}, demo: /demo=live/.test(location.search) };
const getJSON = async url => { const r = await fetch(url, { cache: "no-cache", signal: AbortSignal.timeout(10000) }); if (!r.ok) throw new Error(r.status); return r.json(); };

function normTeam(t) {
  const recs = t.record || t.records || [];
  return { id: String(t.team.id), name: t.team.shortDisplayName || t.team.displayName, abbr: t.team.abbreviation,
    logo: t.team.logos?.[0]?.href || t.team.logo || "", score: t.score?.displayValue ?? t.score ?? "",
    record: (() => { const r = (Array.isArray(recs) ? recs : []).find(r => r.type === "total"); return r?.displayValue || r?.summary || ""; })(), homeAway: t.homeAway, winner: t.winner };
}
function normEvent(ev, sport, teamId = String(ESPN_TEAM_ID)) {
  const c = ev.competitions[0], st = c.status.type, teams = c.competitors.map(normTeam);
  const us = teams.find(t => t.id === teamId) || teams[0], them = teams.find(t => t !== us) || {};
  return { id: ev.id, sport, date: new Date(ev.date), state: st.state, completed: st.completed, detail: st.shortDetail,
    venue: c.venue?.fullName || "", city: [c.venue?.address?.city, c.venue?.address?.state].filter(Boolean).join(", "),
    neutral: c.neutralSite, tv: (c.broadcasts || []).map(b => b.media?.shortName || (b.names || []).join(" / ")).filter(Boolean).join(" / "),
    us, them, home: us.homeAway === "home" };
}
const liveEvents = () => Object.values(espn.events).flat().filter(e => e.state === "in");
const espnFor = g => (espn.events[g.sport] || []).find(e => Math.abs(e.date - when(g)) < 18 * 3600e3);

async function loadEspn() {
  await Promise.all(Object.entries(ESPN_FEEDS).map(async ([sport, path]) => {
    try {
      // (ESPN's /teams/2541 endpoint blocks browsers, so record + standing come from the schedule and the WCC standings feed)
      const [sch, st] = await Promise.all([
        getJSON(`${ESPN_BASE}/${path}/teams/${espnTeamId(sport)}/schedule`),
        getJSON(`https://site.api.espn.com/apis/v2/sports/${path}/standings?group=${WCC_GROUP}`).catch(() => null)]);
      espn.events[sport] = (sch.events || []).map(e => normEvent(e, sport, espnTeamId(sport)));
      const done = espn.events[sport].filter(e => e.completed);
      const info = { record: done[done.length - 1]?.us.record || "" };
      const entries = st?.standings?.entries || [];
      const me = entries.find(x => x.team?.id === espnTeamId(sport));
      if (me) {
        const stat = (key, by = "type") => me.stats.find(s => s[by] === key);
        const seed = +(stat("playoffSeed", "name")?.value ?? entries.indexOf(me) + 1);
        const ord = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
        Object.assign(info, { record: stat("total")?.summary || info.record, conf: stat("vsconf")?.summary,
          streak: stat("streak", "name")?.displayValue, standing: `${ord(seed)} in WCC` });
      }
      espn.team[sport] = info;
    } catch (e) { /* ESPN unreachable — the page keeps working from SCU's calendar */ }
  }));
  await loadSoccer();
  if (espn.demo) { // ?demo=live replays the most recent finished men's basketball game as if it were live
    const done = (espn.events["Men's Basketball"] || []).filter(e => e.completed), ev = done[done.length - 1];
    if (ev) Object.assign(ev, { state: "in", completed: false, detail: "2nd Half · 8:42", demo: true });
  }
  // Passive results: when ESPN says a game is final, fill the score in even if SCU's file is older
  games.forEach(g => {
    const e = espnFor(g);
    if (e?.completed && !g.result && e.us.score !== "" && e.them.score !== "" &&
        Number.isFinite(+e.us.score) && Number.isFinite(+e.them.score)) {
      const a = +e.us.score, b = +e.them.score;
      g.result = `${a > b ? "W" : a < b ? "L" : "D"} ${a}-${b}`;
    }

}

// Soccer: fetch only the days that matter — today, yesterday, and the dates of SCU soccer games in the last/next 10 days.
// Past days are cached; today and yesterday are re-checked every refresh (that's where live/just-finished games are).
const sbCache = {};
const ymdLocal = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
async function loadSoccer() {
  const now = Date.now(), today = ymdLocal(new Date()), yest = ymdLocal(new Date(now - 864e5));
  await Promise.all(Object.entries(ESPN_SB).map(async ([sport, { path, id }]) => {
    const dates = new Set([today, yest]);
    games.filter(g => g.sport === sport && Math.abs(when(g) - now) < 10 * 864e5).forEach(g => dates.add(ymdLocal(when(g))));
    await Promise.all([...dates].map(async day => {
      const key = `${sport}|${day}`;
      if (sbCache[key] && day !== today && day !== yest) return;
      try {
        const d = await getJSON(`${ESPN_BASE}/${path}/scoreboard?dates=${day}&limit=300`);
        sbCache[key] = (d.events || []).filter(e => e.competitions?.[0]?.competitors?.some(t => String(t.team.id) === id)).map(e => normEvent(e, sport, id));
      } catch (e) { /* skip this day */ }
    }));
    const byId = {};
    Object.entries(sbCache).filter(([k]) => k.startsWith(sport + "|")).forEach(([, list]) => list.forEach(e => byId[e.id] = e));
    espn.events[sport] = Object.values(byId).sort((a, b) => a.date - b.date);
    const done = espn.events[sport].filter(e => e.completed), last = done[done.length - 1] || espn.events[sport][0];
    if (last?.us.record) espn.team[sport] = { record: last.us.record };
  }));
}

async function loadSummary(ev) {
  try {
    const d = await getJSON(`${ESPN_BASE}/${espnPath(ev.sport)}/summary?event=${ev.id}`);
    const competition = d.header?.competitions?.[0];
    if (!ev.demo) {
      // ESPN's team schedule can omit both scores while a game is live.
      for (const team of [ev.us, ev.them]) {
        const score = competition?.competitors?.find(c => String(c.id ?? c.team?.id) === team.id)?.score;
        const value = score?.displayValue ?? score?.value ?? score;
        if (typeof value === "number" || (typeof value === "string" && value.trim())) team.score = String(value);
      }
      ev.detail = competition?.status?.type?.shortDetail || ev.detail;
    }
    const lines = {}, stats = {};
    (d.header?.competitions?.[0]?.competitors || []).forEach(c => lines[String(c.team.id)] = (c.linescores || []).map(l => l.displayValue ?? l.value));
    (d.boxscore?.teams || []).forEach(t => stats[String(t.team.id)] = Object.fromEntries((t.statistics || []).filter(s => s.label).map(s => [s.label, s.displayValue])));
    const leaders = (d.leaders || []).map(l => ({ id: String(l.team.id), cats: (l.leaders || []).slice(0, 3).map(c =>
      ({ cat: ({ Points: "PTS", Rebounds: "REB", Assists: "AST", Kills: "K", Digs: "DIG", Blocks: "BLK" })[c.displayName] || (c.shortDisplayName || c.displayName || "").slice(0, 4).toUpperCase(), name: c.leaders?.[0]?.athlete?.shortName, val: c.leaders?.[0]?.displayValue })) }));
    const plays = d.plays || [], wpa = d.winprobability || [];
    const pi = ev.demo ? Math.floor(plays.length * .72) : plays.length - 1;
    const wi = ev.demo ? Math.floor(wpa.length * .72) : wpa.length - 1;
    // each team's last five results (ESPN includes this for soccer and basketball)
    const last5 = {};
    (d.lastFiveGames || []).forEach(t => last5[String(t.team?.id)] = (t.events || []).slice(-5).map(x =>
      ({ r: x.gameResult === "T" ? "D" : x.gameResult, score: x.score, opp: x.opponent?.abbreviation, date: x.gameDate })));
    // most recent plays, newest first. ESPN sends play-by-play for basketball, baseball and softball
    // (not volleyball or soccer), so these lists are empty for those sports and the box is skipped.
    const sofar = plays.slice(0, pi + 1).filter(p => p.text);
    const toPlay = p => ({ text: p.text, scoring: !!p.scoringPlay, tid: String(p.team?.id ?? ""), away: p.awayScore, home: p.homeScore,
      when: [[p.period?.type === "Top" || p.period?.type === "Bottom" ? p.period.type : "", p.period?.displayValue].filter(Boolean).join(" "),
             p.clock?.displayValue].filter(Boolean).join(" · ") });
    const recentPlays = sofar.slice(-5).reverse().map(toPlay);
    const scoringPlays = sofar.filter(p => p.scoringPlay).slice(-5).reverse().map(toPlay);
    const allScoring = sofar.filter(p => p.scoringPlay).map(toPlay); // whole game, oldest first (game pages)
    espn.summary[ev.id] = { lines, stats, leaders, last5, recentPlays, scoringPlays, allScoring, lastPlay: plays[pi]?.text, wpHome: wpa[wi]?.homeWinPercentage };
  } catch (e) { /* box score not available yet */ }
}
async function loadNews(sport) {
  if (espn.news[sport] || !ESPN_FEEDS[sport]) return;
  try {
    const d = await getJSON(`${ESPN_BASE}/${ESPN_FEEDS[sport]}/news?team=${espnTeamId(sport)}&limit=4`);
    espn.news[sport] = (d.articles || []).map(a => ({ title: a.headline, desc: a.description, url: a.links?.web?.href, date: a.published }));

// ---------- game center rendering ----------
const initials = n => { const w = String(n || "?").replace(/[^A-Za-z ]/g, "").split(/\s+/).filter(Boolean);
  return (w.length === 1 ? w[0].slice(0, 3) : w.map(x => x[0]).join("").slice(0, 3)).toUpperCase(); };
const logo = (t, cls = "") => t?.logo

function cdCells(ms) {

  const s = Math.floor(ms / 1000), parts = [["DAYS", Math.floor(s / 86400)], ["HRS", Math.floor(s / 3600) % 24], ["MIN", Math.floor(s / 60) % 60], ["SEC", s % 60]];

// ---------- final score hold ----------
// After a game ends, the next-game box keeps showing its final score for a while (people check the site for the
// final), then switches to the next game's countdown. The hold is half the time until the next game, capped at
// 3 hours: with 6+ hours until the next game it holds the full 3 hours, a doubleheader 2 hours later gets 1 hour.
// Neither ESPN nor SCU gives an end time, so "ended" is the start time plus a typical game length for the sport.
const GAME_HOURS = [["Beach Volleyball", 2], ["Basketball", 2], ["Soccer", 2], ["Volleyball", 2], ["Water Polo", 1.5],
  ["Baseball", 3], ["Softball", 2.5], ["Tennis", 3]];
const HOLD_MAX = 3 * 3600e3;
const estEnd = g => when(g).getTime() + (GAME_HOURS.find(([k]) => g.sport.includes(k))?.[1] ?? 2.5) * 3600e3;
function heldFinal(arr, up) {
  const now = Date.now();
  const last = arr.filter(g => !g.allDay && !g.meet && /^[WLD] \d+-\d+/.test(g.result || "") && when(g).getTime() <= now)
    .sort((a, b) => when(b) - when(a))[0];
  if (!last) return null;
  const ended = estEnd(last), next = up.find(g => when(g).getTime() > when(last).getTime());
  const hold = Math.min(HOLD_MAX, next ? Math.max(0, when(next) - ended) / 2 : HOLD_MAX);
  return now < ended + hold ? last : null;
}
function finalCenter(g, next) {
  const e = espnFor(g), s = sportOf(g.sport), k = g.result[0];
  const [ours, theirs] = g.result.slice(2).split("-"); // results are written Broncos-first, e.g. "L 16-17"
  const us = e ? { ...e.us, record: e.us.record || espn.team[g.sport]?.record } : SCU_TEAM(g.sport);
  const them = e ? e.them : { name: g.opponent, logo: g.logo };
  // same layout as the next-game box: away team left, home team right
  const [L, R] = venueOf(g) === "home" ? [[them, theirs], [us, ours]] : [[us, ours], [them, theirs]];
  const link = e?.completed ? [espnGameUrl(e), ESPN_SB[g.sport] ? "MATCH CENTER" : "BOX SCORE"]
    : g.boxscore ? [g.boxscore, "BOX SCORE"] : g.recap ? [g.recap, "RECAP"] : null;
  return `
    <div class="gc-top">${icon(s.id, "run")}<b>${esc(g.sport.toUpperCase())}</b><span class="sp"></span><span class="final-pill">FINAL</span></div>
    <div class="gc-main">
      <div class="gc-match">${teamBlock(L[0])}<div class="gc-score"><div><b>${esc(L[1])}</b><span>–</span><b>${esc(R[1])}</b></div>
        <div class="gc-clock ${k}">${k === "W" ? "BRONCOS WIN" : k === "L" ? "BRONCOS LOSE" : "DRAW"}</div></div>${teamBlock(R[0])}</div>
      <div class="gc-when">${esc(fmtLong(g))} · ${esc(g.location)}</div>
    </div>
    <div class="gc-side">
      <div class="gc-info"><a href="${gameHref(g)}">GAME DETAILS →</a>${link ? `<a href="${esc(link[0])}" target="_blank" rel="noopener">${link[1]} ↗</a>` : ""}
        ${next ? `<span><b>NEXT UP</b> ${esc(next.sport)} ${esc(versus(next))} · ${esc(when(next).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }))} · ${esc(fmtTime(next))}</span>` : ""}
        <a href="https://mixlr.com/kscusports" target="_blank" rel="noopener">LISTEN · KSCU ↗</a></div>
    </div>`;
}

// "Last 5 plays" box. The Scoring only toggle is remembered while the page is open, so it survives the 15s redraws.
const playFilter = { scoring: false };
function playsBox(sm, e, away, home) {
  const list = playFilter.scoring ? sm.scoringPlays : sm.recentPlays;
  const teamOf = id => [e.us, e.them].find(t => t.id === id);
  const rows = list.length ? list.map(p => { const t = teamOf(p.tid);
      return `<li class="${p.scoring ? "sc" : ""}"><span class="pl-when">${esc(p.when)}</span>
        <span class="pl-text">${t ? logo(t, "xs") : ""}${esc(p.text)}</span>
        ${p.scoring ? `<span class="pl-score">${esc(away.abbr)} ${esc(p.away)}–${esc(p.home)} ${esc(home.abbr)}</span>` : ""}</li>`; }).join("")
    : `<li class="pl-none">No scoring plays yet.</li>`;
  return `<div class="gc-plays"><div class="pl-head"><b>${playFilter.scoring ? "LAST 5 SCORING PLAYS" : "LAST 5 PLAYS"}</b>

}

// ESPN box score pieces (linescore, team stat bars, leaders), shared by the live box and the game pages
function espnBox(e, sm) {
  const away = e.home ? e.them : e.us, home = e.home ? e.us : e.them;
  const isVB = e.sport.includes("Volleyball"), isWBB = e.sport.startsWith("Women's Basketball"), isBase = /Baseball|Softball/.test(e.sport);
  const pl = i => isBase ? `${i + 1}` : isVB ? `S${i + 1}` : isWBB ? (i < 4 ? `Q${i + 1}` : `OT${i - 3}`) : (i < 2 ? `${i + 1}H` : `OT${i - 1}`);
  const la = sm.lines?.[away.id] || [], lh = sm.lines?.[home.id] || [], n = Math.max(la.length, lh.length);
  const side = t => t.id === e.us.id ? "us" : "them";
  const linescore = n ? `<table class="ls"><thead><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${pl(i)}</th>`).join("")}<th>${isVB ? "SETS" : isBase ? "R" : "T"}</th></tr></thead><tbody>
      ${[[away, la], [home, lh]].map(([t, l]) => `<tr class="${side(t)}"><td>${logo(t, "xs")}${esc(t.abbr)}</td>${Array.from({ length: n }, (_, i) => `<td>${esc(l[i] ?? "")}</td>`).join("")}<td class="tot">${esc(t.score || "—")}</td></tr>`).join("")}
    </tbody></table>` : "";
  const want = isVB ? null : ["Field Goal %", "Three Point %", "Rebounds", "Assists", "Turnovers"];
  const sa = sm.stats?.[away.id] || {}, sh = sm.stats?.[home.id] || {};
  const keys = (want || Object.keys(sa).filter(k => !isNaN(parseFloat(sa[k])) && !String(sa[k]).includes("-")).slice(0, 5)).filter(k => k in sa && k in sh);
  const bars = keys.length ? `<div class="sbars">${keys.map(k => { const a = parseFloat(sa[k]) || 0, h = parseFloat(sh[k]) || 0, t = a + h || 1;
      return `<div class="sb"><div class="sb-l">${esc(k.toUpperCase())}</div><span>${esc(sa[k])}</span><div class="sb-bar"><i class="${side(away)}" style="width:${a / t * 100}%"></i><i class="${side(home)}" style="width:${h / t * 100}%"></i></div><span>${esc(sh[k])}</span></div>`;
    }).join("")}</div>` : "";
  const ldr = (sm.leaders || []).length ? `<div class="ldr">${[e.us, e.them].map(t => { const L = sm.leaders.find(x => x.id === t.id);
      return `<div><h5>${logo(t, "xs")}${esc(t.abbr)} LEADERS</h5>${(L?.cats || []).map(c => `<p><span>${esc(c.cat)}</span><b>${esc(c.name || "—")}</b><em>${esc(c.val || "")}</em></p>`).join("")}</div>`; }).join("")}</div>` : "";
  return { away, home, side, linescore, bars, ldr };
}

function liveCenter(e) {
  const sm = espn.summary[e.id] || {}, s = sportOf(e.sport);
  const { away, home, side, linescore, bars, ldr } = espnBox(e, sm);
  const wp = sm.wpHome != null ? (() => { const h = Math.round(sm.wpHome * 100), a = 100 - h;
    return `<div class="wp"><div class="wp-l"><span>${esc(away.abbr)} ${a}%</span><span>WIN PROBABILITY</span><span>${h}% ${esc(home.abbr)}</span></div>
      <div class="wp-bar"><i class="${side(away)}" style="width:${a}%"></i><i class="${side(home)}" style="width:${h}%"></i></div></div>`; })() : "";

        <div class="gc-clock">${esc(e.detail)}</div></div>${teamBlock(home)}</div>

    </div>${(() => {
      const form = [e.us, e.them].filter(t => sm.last5?.[t.id]?.length).map(t => `<div class="l5-row">${logo(t, "xs")}<b>${esc(t.abbr)}</b>
        <div class="form lg">${sm.last5[t.id].map(x => `<i class="${esc(x.r)}" title="${esc((x.r || "") + " " + (x.score || "") + " vs " + (x.opp || ""))}">${esc(x.r)}</i>`).join("")}</div></div>`).join("");
      const l5 = form ? `<div class="l5"><h5>LAST 5 · BEFORE TODAY</h5>${form}</div>` : "";

// ---------------------------------------------------------------------------
// GAME PAGE (#/game/<id>): the final score of one finished game, with whatever box score exists.
// ESPN covers basketball, volleyball, soccer, baseball and softball; for the rest the period scores and team
// stats come from SCU's box score page (read by build_snapshot.py into scu-schedule.json as "box").
// ---------------------------------------------------------------------------
const summaryAsked = new Set();
function requestSummary(ev) {
  if (summaryAsked.has(ev.id)) return;
  summaryAsked.add(ev.id);
  loadSummary(ev).then(() => { if (current?.sport === "game") rerenderQuiet(); });
}
const isScu = name => /Santa Clara/.test(name || "");
function scuBox(g, us, them) {
  const b = g.box;
  if (!b?.teams?.length) return { linescore: "", bars: "" };
  const [ours, theirs] = g.result.slice(2).split("-");
  const isVB = g.sport.includes("Volleyball");
  const hasTot = b.cols.includes("T");
  const head = b.cols.map(c => c === "T" ? (isVB ? "SETS" : "T") : c);
  const rows = b.teams.map(t => { const mine = isScu(t.name), team = mine ? us : them;
    const tot = hasTot ? "" : `<td class="tot">${esc(mine ? ours : theirs)}</td>`;
    return `<tr class="${mine ? "us" : "them"}"><td>${logo({ ...team, name: t.name }, "xs")}${esc(t.abbr || t.name)}</td>${t.cells.map((c, i) => `<td${b.cols[i] === "T" ? ' class="tot"' : ""}>${esc(c)}</td>`).join("")}${tot}</tr>`; }).join("");
  const linescore = `<table class="ls"><thead><tr><th></th>${head.map(h => `<th>${esc(h)}</th>`).join("")}${hasTot ? "" : `<th>${isVB ? "SETS" : "T"}</th>`}</tr></thead><tbody>${rows}</tbody></table>`;
  const num = v => /^\d+(\.\d+)?( \(\d+\))?$/.test(v) ? parseFloat(v) : null;
  const tidy = v => String(v).replace(/\.0$/, "");
  const [ta, tb] = b.teams, sa = isScu(ta.name) ? "us" : "them", sb = isScu(tb.name) ? "us" : "them";
  const bars = b.stats?.length ? `<div class="sbars"><div class="sb sb-h"><span>${esc(ta.abbr || ta.name)}</span><span></span><span>${esc(tb.abbr || tb.name)}</span></div>${b.stats.map(([k, a, h]) => {
      const x = num(a), y = num(h), t = (x || 0) + (y || 0) || 1, ok = x != null && y != null;
      return `<div class="sb"><div class="sb-l">${esc(k.toUpperCase())}</div><span>${esc(tidy(a))}</span><div class="sb-bar${ok ? "" : " none"}">${ok ? `<i class="${sa}" style="width:${x / t * 100}%"></i><i class="${sb}" style="width:${y / t * 100}%"></i>` : ""}</div><span>${esc(tidy(h))}</span></div>`;
    }).join("")}</div>` : "";
  return { linescore, bars };
}
function scoringList(sm, e, away, home) {
  const list = sm.allScoring || [];
  if (!list.length) return "";
  const teamOf = id => [e.us, e.them].find(t => t.id === id);
  return `<div class="gc-plays gd-plays"><div class="pl-head"><b>SCORING PLAYS · ${list.length}</b></div><ol>${list.map(p => { const t = teamOf(p.tid);
      return `<li class="sc"><span class="pl-when">${esc(p.when)}</span><span class="pl-text">${t ? logo(t, "xs") : ""}${esc(p.text)}</span>
        <span class="pl-score">${esc(away.abbr)} ${esc(p.away)}–${esc(p.home)} ${esc(home.abbr)}</span></li>`; }).join("")}</ol></div>`;
}
function gamePage(key) {
  const g = games.find(x => gameKey(x) === key);
  if (!g || !isFinal(g)) return `<div class="empty" style="margin:28px 0">We couldn't find that game. <a href="#/">Back to all sports</a></div>`;
  const s = sportOf(g.sport), gender = genderOf(g.sport), k = g.result[0];
  current.resolved = gender; current.gameSport = s.id; // so the menus mark this team
  const e = espnFor(g), done = e?.completed ? e : null;
  if (done && !espn.summary[done.id]) requestSummary(done);
  const sm = done ? espn.summary[done.id] || {} : {};
  const [ours, theirs] = g.result.slice(2).split("-"); // Broncos-first, e.g. "L 16-17"
  const us = done ? done.us : { ...SCU_TEAM(g.sport), record: "" };
  const them = done ? done.them : { name: g.opponent, logo: g.logo };
  const [L, R] = venueOf(g) === "home" ? [[them, theirs], [us, ours]] : [[us, ours], [them, theirs]];
  const eb = done ? espnBox(done, sm) : null, sb = scuBox(g, us, them);
  const linescore = eb?.linescore || sb.linescore, bars = eb?.bars || sb.bars, ldr = eb?.ldr || "";
  const plays = done ? scoringList(sm, done, eb.away, eb.home) : "";
  const side = bars || ldr ? `<div class="gd-grid">${bars ? `<div><h5 class="gd-h">TEAM STATS</h5>${bars}</div>` : ""}${ldr ? `<div><h5 class="gd-h">LEADERS</h5>${ldr}</div>` : ""}</div>` : "";
  const venueLine = done?.venue ? `${done.venue}${done.city ? ", " + done.city : ""}` : g.location;
  const links = [done && [espnGameUrl(done), ESPN_SB[g.sport] ? "ESPN MATCH CENTER" : "ESPN BOX SCORE"],
    g.boxscore && [g.boxscore, /\.pdf($|\?)/i.test(g.boxscore) ? "OFFICIAL RESULTS (PDF)" : "SCU BOX SCORE"], g.recap && [g.recap, "RECAP"]]
    .filter(Boolean).map(([u, t]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${t} ↗</a>`).join("");
  const tg = teamGames(s.id, gender), more = resultsOf(tg).filter(x => x !== g).slice(0, 5);
  const team = href(s.id, gender);
  return `
    <nav class="crumbs"><a href="${team}">← ${esc(g.sport)}</a><span>/</span><span>${esc(versus(g))}</span></nav>
    <div class="card featured"><div class="tab">FINAL SCORE</div><div class="tab right mono">${esc(when(g).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }).toUpperCase())}</div>
      <div class="box gc game-detail">
        <div class="gc-top">${icon(s.id, "run")}<b>${esc(g.sport.toUpperCase())}</b><span class="sp"></span>${venueTag(g)}<span class="final-pill">FINAL</span></div>
        <div class="gc-match">${teamBlock(L[0])}<div class="gc-score"><div><b>${esc(L[1])}</b><span>–</span><b>${esc(R[1])}</b></div>
          <div class="gc-clock ${k}">${k === "W" ? "BRONCOS WIN" : k === "L" ? "BRONCOS LOSE" : "DRAW"}</div></div>${teamBlock(R[0])}</div>
        <div class="gc-when">${esc(fmtLong(g))}${g.allDay ? "" : " · " + esc(fmtTime(g))}</div>
        ${linescore}${side}${plays}
        <div class="gc-info"><span><b>VENUE</b> ${esc(venueLine)}</span>${links}</div>
      </div></div>
    ${more.length ? `<div class="card section-gap"><div class="tab">MORE ${esc(g.sport.toUpperCase())} RESULTS</div><a class="tab right mono" href="${team}" style="text-decoration:none">ALL RESULTS →</a>
      <div class="box">${more.map(x => gameRow(x)).join("")}</div></div>` : `<div class="section-gap"></div>`}`;
}

// ---------------------------------------------------------------------------
// ROSTERS: players and coaches from SCU's roster pages (prototypes/build_rosters.py, refreshed twice a year).
// Photos load straight from SCU's image server, cropped to the face.
// ---------------------------------------------------------------------------
let rosters = null, rosterAsked = false;
const rosterOpen = {};
const ROSTER_FIRST = 12;
const rosterSlug = (sportId, gender) => ["baseball", "softball"].includes(sportId) ? sportId : `${gender}-${sportId === "xc" ? "cross-country" : sportId}`;
function loadRosters() {
  if (rosterAsked) return;
  rosterAsked = true;
  fetch(ROSTER_URL, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(d => { rosters = d?.teams || {}; })
    .catch(() => { rosters = {}; }).finally(swapRosters);
}
function swapRosters() { document.querySelectorAll("[data-roster]").forEach(el => { el.outerHTML = rosterCard(el.dataset.roster); }); }
function rosterCard(slug) {
  loadRosters();

  if (rosters === null) return shell("SCU ATHLETICS", `<div class="empty">Loading roster…</div>`);
  const r = rosters[slug];
  if (!r?.players?.length) return "";
  const open = rosterOpen[slug], list = open ? r.players : r.players.slice(0, ROSTER_FIRST);
  const photo = (p, cls) => `<div class="${cls}" data-ini="${esc(initials(p.name))}">${p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;
  const cards = list.map(p => `<a class="ro-card" href="${esc(p.url || r.url)}" target="_blank" rel="noopener">
      ${photo(p, "ro-ph")}${p.num ? `<span class="ro-num">#${esc(p.num)}</span>` : ""}
      <div class="ro-info"><b>${esc(p.name)}</b><span>${esc([p.pos, p.year].filter(Boolean).join(" · "))}</span>
        <span class="ro-meta">${esc([p.ht, p.hometown].filter(Boolean).join(" · "))}</span></div></a>`).join("");
  const staff = (r.coaches || []).filter(c => /coach/i.test(c.title)).slice(0, 6);
  const coaches = staff.length ? `<div class="ro-coaches"><h5 class="gd-h">COACHES</h5><div>${staff.map(c =>
      `<div class="ro-coach">${photo(c, "ro-cph")}<div><b>${esc(c.name)}</b><span>${esc(c.title)}</span></div></div>`).join("")}</div></div>` : "";
  const more = r.players.length > ROSTER_FIRST
    ? `<button class="more" data-roster-all="${esc(slug)}">${open ? "SHOW FEWER ↑" : `SHOW ALL ${r.players.length} PLAYERS ↓`}</button>` : "";
  return shell(`${esc(r.season)} · ${r.players.length} PLAYERS · <a href="${esc(r.url)}" target="_blank" rel="noopener">SCU ↗</a>`,

function newsList(sport) {
  const a = espn.news[sport];
  if (!a) return `<div class="empty">Loading headlines…</div>`;
  if (!a.length) return `<div class="empty">No recent ESPN headlines.</div>`;
  return a.map(x => `<a href="${esc(x.url || "#")}" target="_blank" rel="noopener"><h4>${esc(x.title)}</h4>${x.desc ? `<p>${esc(x.desc)}</p>` : ""}
    <span class="meta">${x.date ? new Date(x.date).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : ""} · ESPN ↗</span></a>`).join("");
}

// ---------- Mixlr "on the call" bar: Mixlr's public API says whether KSCU Sports is broadcasting ----------
const mixlr = { live: false, avatar: "", open: false, autoOpened: false };
function onAirBar() {
  return `<div class="onair ${mixlr.live ? "is-live" : ""}" id="onair">
      ${mixlr.avatar ? `<img src="${esc(mixlr.avatar)}" alt="">` : ""}<span class="dot"></span>
      <b>ON THE CALL</b><span>${mixlr.live ? "KSCU Sports is LIVE — Bronco play-by-play" : "KSCU Sports is off air right now"}</span>

async function refreshMixlr() {
  try {
    const d = await getJSON("https://api.mixlr.com/users/kscusports");
    const was = mixlr.live;
    mixlr.live = !!d.is_live; mixlr.avatar = d.profile_image_url || "";
    if (mixlr.live && !mixlr.autoOpened) { mixlr.open = true; mixlr.autoOpened = true; } // pop the player open when a broadcast starts
    if (!mixlr.live && was) { mixlr.open = false; mixlr.autoOpened = false; } // broadcast over: put the player away, auto-open again next time
    if (was !== mixlr.live || !document.querySelector("#onair img")) swapOnAir();

}

}

// ---------- one short animation pass when a page appears, so the icons show off without looping forever ----------
let introUntil = 0;
function maybeIntro() { if (Date.now() < introUntil && !matchMedia("(prefers-reduced-motion: reduce)").matches) introPlay(); }
function introPlay() {
  document.querySelectorAll(".tile, .wk, #rail a").forEach((el, i) => {
    setTimeout(() => { el.classList.add("run"); setTimeout(() => el.classList.remove("run"), 2600); }, 120 + i * 90);
  });
}

// ---------- refresh loop ----------
let liveKey = null;
function rerenderQuiet() {
  if (!current) return;
  const v = document.getElementById("view"), y = scrollY;
  v.classList.add("noanim");
  v.innerHTML = renderView();
  markMenu(); scrollTo(0, y);
  maybeIntro(); // first ESPN redraw lands right after load: replay the intro on the fresh tiles
}
const refreshButton = document.getElementById("ks-refresh-scores");
const refreshStatus = document.getElementById("ks-refresh-status");
let scoreTimer, statusTimer;
// "Game time": an ESPN-covered Broncos game is live, or one is due to start within 15 minutes / should still be going
// (ESPN can take a few minutes to flip a game to live). That's when the page checks every 15 seconds and shows the
// manual "Refresh scores" button; the rest of the time the button is hidden and the page checks once a minute.
const gameTime = () => liveEvents().length > 0 || games.some(g => espnPath(g.sport) && !g.result && !g.allDay && !g.meet &&
  Date.now() > when(g).getTime() - 15 * 60e3 && Date.now() < estEnd(g) + 30 * 60e3);
function showRefresh() {
  const on = gameTime();
  refreshButton.closest(".score-tools").hidden = !on;
  if (!on) refreshStatus.textContent = "";
  return on;
}

async function refreshEspn(manual = false) {
  clearTimeout(scoreTimer);
  refreshButton.disabled = true;
  if (manual) refreshStatus.textContent = "Checking ESPN…";
  try {
    await loadEspn();
    const lv = liveEvents();
    const strip = document.getElementById("live-strip");
    strip.innerHTML = lv.length ? `<span class="dot pulse"></span> LIVE NOW ` + lv.map(e =>
      `<a href="${href(sportOf(e.sport).id, genderOf(e.sport))}">${esc(e.sport)}: ${esc(e.us.abbr)} ${esc(e.us.score || "—")} – ${esc(e.them.score || "—")} ${esc(e.them.abbr)} (${esc(e.detail)})</a>`).join(" · ") : "";
    strip.classList.toggle("on", lv.length > 0);
    document.querySelectorAll("#rail .livepip").forEach(p => p.remove());
    lv.forEach(e => document.querySelector(`#rail a[data-sport="${sportOf(e.sport).id}"]`)?.insertAdjacentHTML("beforeend", `<span class="dot pulse livepip"></span>`));
    // re-draw only when something visible changed, so the page doesn't flicker every minute
    // (includes which final score is being held, so the box flips back to the countdown when the hold ends)
    const tg = current?.sport && current.sport !== "calendar" ? teamGames(current.sport, current.resolved) : null;
    const held = [heldFinal(games, upcomingOf(games)), tg && heldFinal(tg, upcomingOf(tg))].map(g => g?.start || null);
    const key = JSON.stringify([lv.map(e => [e.id, e.us.score, e.them.score, e.detail, espn.summary[e.id]?.lastPlay]), Object.keys(espn.events).length, games.map(g => g.result), held]);
    if (key !== liveKey) { liveKey = key; rerenderQuiet(); }
    if (manual) { refreshStatus.textContent = "Scores up to date"; clearTimeout(statusTimer); statusTimer = setTimeout(() => { refreshStatus.textContent = ""; }, 4000); }
  } catch (error) {
    if (manual) refreshStatus.textContent = "Couldn’t check scores. Try again.";
    console.warn("Score refresh failed", error);
  } finally {
    refreshButton.disabled = false;
    scoreTimer = setTimeout(refreshEspn, showRefresh() ? 15000 : 60000);
  }
}
refreshButton.addEventListener("click", () => refreshEspn(true));

// Schedule: fetch both copies and use whichever is newer (the GitHub one normally; the built-in one if GitHub is down).
// While the page is open it re-checks every 10 minutes, so new results and times appear without a reload.
let scheduleUpdated = "";
async function loadSchedule() {
  const get = url => fetch(url, { cache: "no-cache", signal: AbortSignal.timeout(8000) }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  const got = (await Promise.allSettled([get(LIVE_SCHEDULE_URL), get(SCHEDULE_URL)]))
    .filter(x => x.status === "fulfilled" && Array.isArray(x.value?.games) && x.value.games.length).map(x => x.value);
  if (!got.length) throw new Error("schedule unavailable");
  const d = got.sort((a, b) => String(b.updated).localeCompare(String(a.updated)))[0];
  if (d.updated === scheduleUpdated) return false;
  scheduleUpdated = d.updated;
  // soccer-style wording: ties are shown as draws ("T 1-1" -> "D 1-1")
  games = d.games.map(g => (g.result && /^T \d/.test(g.result) ? { ...g, result: "D" + g.result.slice(1) } : g))
                 .sort((a, b) => when(a) - when(b));
  games.forEach(g => sportOf(g.sport)); // register any sport we don't have a tab for yet (gets a generic icon)
  document.getElementById("footer").textContent =
    `Updated ${new Date(d.updated).toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" })}`;
  return true;
}
loadSchedule().then(() => {
  buildMenus(); route();
  refreshEspn(); refreshMixlr();
  setInterval(() => loadSchedule().then(changed => {
    if (!changed) return;
    buildMenus(); markRail(); liveKey = null; refreshEspn(); // redraws with the new schedule (and re-applies ESPN scores)
  }).catch(() => { /* keep showing what we have */ }), 10 * 60e3);
}).catch(() => {
  document.getElementById("view").innerHTML = `<div class="empty" style="margin:28px 0">Couldn't load the schedule.</div>`;
});
</script>
</body>
</html>
