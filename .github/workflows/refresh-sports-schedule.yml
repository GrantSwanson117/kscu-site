# Keeps kscu.org/sports/ up to date with Santa Clara Athletics' schedule, without rebuilding the site.
#
# Every hour this pulls SCU's public calendar (plus each sport's schedule page and new box scores). If any game
# changed, it commits scu-schedule.json to the `sports-data` branch. The sports page reads that file straight from
# GitHub, so updates show up on the site without a Netlify build. (Netlify is told to ignore that branch.)
#
# Once a week it also copies the file into content/sports/scu-schedule.json on main. That copy is built into the
# site as a fallback in case GitHub is unreachable; refreshing it weekly costs one Netlify build a week.
#
# If nothing changed, nothing is committed. If SCU's site is down, the run fails without touching the data.
# Run it by hand: GitHub > Actions > "Refresh sports schedule" > Run workflow (tick the box to also update main).
#
# Live scores (ESPN) and Mixlr status don't need this; they update in the visitor's browser.

name: Refresh sports schedule

on:
  schedule:
    - cron: "17 * * * *"    # hourly: data branch only
    - cron: "47 12 * * 1"   # Mondays ~5am Pacific: also refresh the fallback copy on main
  workflow_dispatch:
    inputs:
      update_main:
        description: "Also update the copy built into the site (content/sports/scu-schedule.json on main)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # weekly: keep the health check job switched on (see sports-health.yml)

concurrency:
  group: refresh-sports-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the data branch
        uses: actions/checkout@v4
        with:
          ref: sports-data
          path: sports-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh schedule from Santa Clara Athletics
        run: python3 prototypes/build_snapshot.py sports-data/scu-schedule.json

      - name: Commit to the data branch if the schedule changed
        working-directory: sports-data
        run: |
          if git diff --quiet -- scu-schedule.json; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add scu-schedule.json
          git commit -m "Refresh sports schedule from Santa Clara Athletics"
          git push origin HEAD:sports-data

      - name: Weekly - keep the health check switched on
        if: github.event.schedule == '47 12 * * 1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/sports-health.yml/enable" || echo "couldn't re-enable the health check"

      - name: Weekly - refresh the fallback copy on main
        if: github.event.schedule == '47 12 * * 1' || inputs.update_main
        run: |
          cp sports-data/scu-schedule.json content/sports/scu-schedule.json
          if git diff --quiet -- content/sports/scu-schedule.json; then
            echo "Fallback copy already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git add content/sports/scu-schedule.json
          git commit -m "Weekly refresh of the built-in sports schedule"
          git pull --rebase origin main
          git push origin HEAD:main
